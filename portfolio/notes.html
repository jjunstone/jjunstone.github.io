<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archive | 이준석</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<style>
  :root{
    --ink:#0f172a;
    --ink-soft:#475569;
    --ink-faint:#94a3b8;
    --line:#e2e8f0;
    --line-strong:#cbd5e1;
    --navy:#173c78;
    --blue:#2563eb;
    --blue-soft:#eff4fd;
    --bg-page:#f8fafc;
    --bg-card:#ffffff;
    --font-main:"Pretendard",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
    --font-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background-color:var(--bg-page);
    color:var(--ink);
    font-family:var(--font-main);
    -webkit-font-smoothing:antialiased;
  }
  body.modal-open{ overflow:hidden; }

  .topbar{
    position:sticky; top:0; z-index:40;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    max-width:1280px;
    margin:0 auto;
    padding:18px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .topbar-brand{
    font-weight:800;
    text-decoration:none;
    font-size:1.18rem;
    color:var(--navy);
  }
  .topbar-links{ display:flex; gap:24px; }
  .topbar-links a{
    color:var(--ink-soft);
    text-decoration:none;
    font-size:.95rem;
    font-weight:600;
  }
  .topbar-links a:hover{ color:var(--navy); }

  main{
    max-width:1280px;
    margin:0 auto;
    padding:36px 24px 96px;
  }

  .blog-hero{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    padding-bottom:24px;
    margin-bottom:28px;
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .page-eyebrow{
    display:inline-block;
    font-size:.73rem;
    font-weight:700;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--navy);
    background:var(--blue-soft);
    padding:4px 10px;
    border-radius:6px;
    margin:0 0 8px;
  }
  .page-title{
    font-size:1.95rem;
    font-weight:800;
    margin:0 0 6px;
  }
  .page-lead{
    font-size:.93rem;
    line-height:1.6;
    color:var(--ink-soft);
    margin:0;
  }
  .btn-primary{
    font:inherit;
    font-size:.83rem;
    font-weight:700;
    color:#ffffff;
    background:var(--navy);
    border-radius:9px;
    padding:10px 16px;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
  }

  .blog-layout{
    display:grid;
    grid-template-columns:230px 1fr;
    gap:32px;
    align-items:start;
  }

  .blog-sidebar{
    position:sticky;
    top:84px;
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 14px;
  }
  .sidebar-group{
    margin-bottom:18px;
    padding-bottom:16px;
    border-bottom:1px solid var(--line);
  }
  .sidebar-group:last-child{
    margin-bottom:0;
    padding-bottom:0;
    border-bottom:none;
  }
  .sidebar-heading{
    font-size:.71rem;
    font-weight:800;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-faint);
    padding:0 10px;
    margin:0 0 6px;
  }
  .sidebar-nav{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .cat-btn{
    width:100%;
    font:inherit;
    font-size:.85rem;
    font-weight:600;
    color:var(--ink-soft);
    background:transparent;
    border:none;
    border-radius:8px;
    padding:8px 10px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    text-align:left;
  }
  .cat-btn:hover{ background:var(--bg-page); color:var(--navy); }
  .cat-btn.active{ background:var(--blue-soft); color:var(--navy); font-weight:700; }
  .cat-count{
    font-family:var(--font-mono);
    font-size:.73rem;
    color:var(--ink-faint);
    background:var(--bg-page);
    padding:1px 7px;
    border-radius:999px;
  }

  .feed-toolbar{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .notes-search{
    flex:1;
    min-width:220px;
  }
  .notes-search input{
    width:100%;
    padding:10px 14px;
    border:1px solid var(--line-strong);
    border-radius:10px;
    font:inherit;
    font-size:.88rem;
    color:var(--ink);
    background:var(--bg-card);
  }
  .notes-count{
    font-size:.84rem;
    color:var(--ink-soft);
    white-space:nowrap;
    font-weight:600;
  }

  .view-toggle{
    display:inline-flex;
    background:var(--bg-card);
    border:1px solid var(--line-strong);
    border-radius:8px;
    padding:2px;
  }
  .view-btn{
    font:inherit;
    font-size:.76rem;
    font-weight:600;
    color:var(--ink-soft);
    background:transparent;
    border:none;
    padding:5px 12px;
    border-radius:6px;
    cursor:pointer;
  }
  .view-btn.active{
    background:var(--navy);
    color:#ffffff;
  }

  .notes-board.list-view{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .notes-board.grid-view{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    gap:18px;
  }

  .post-item{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-left:4px solid var(--navy);
    border-radius:12px;
    padding:20px 22px;
    cursor:pointer;
    transition:transform .16s ease, box-shadow .16s ease;
    display:flex;
    flex-direction:column;
  }
  .post-item:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 24px -10px rgba(15,23,42,.1);
  }
  .post-meta{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:.75rem;
    color:var(--ink-faint);
    margin-bottom:8px;
  }
  .post-issue{
    font-family:var(--font-mono);
    font-weight:700;
    color:var(--navy);
    background:var(--blue-soft);
    padding:2px 7px;
    border-radius:4px;
  }
  .post-title{
    font-size:1.06rem;
    font-weight:800;
    color:var(--ink);
    margin:0 0 8px;
    line-height:1.42;
  }
  .post-excerpt{
    font-size:.86rem;
    line-height:1.62;
    color:var(--ink-soft);
    margin:0 0 14px;
    white-space:pre-line;
    max-height:4.8em;
    overflow:hidden;
  }
  .post-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-top:auto;
    padding-top:10px;
    border-top:1px solid var(--line);
  }
  .post-tags{ display:flex; gap:6px; flex-wrap:wrap; }
  .note-label-chip{
    font-size:.72rem;
    font-weight:600;
    color:var(--navy);
    background:var(--blue-soft);
    padding:2px 8px;
    border-radius:6px;
  }
  .post-more{
    font-size:.75rem;
    font-weight:700;
    color:var(--navy);
    margin-left:auto;
  }

  .notes-state{
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:10px;
    padding:64px 24px;
    background:var(--bg-card);
    border:1px dashed var(--line-strong);
    border-radius:14px;
    color:var(--ink-soft);
    font-size:.92rem;
    text-align:center;
    line-height:1.6;
  }
  .notes-state.show{ display:flex; }

  .modal-backdrop{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(15,23,42,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .modal-backdrop.open{ display:flex; }
  .modal-dialog{
    background:var(--bg-card);
    width:100%;
    max-width:820px;
    max-height:90vh;
    border-radius:16px;
    border:1px solid var(--line);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .modal-topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 24px;
    border-bottom:1px solid var(--line);
    background:var(--bg-page);
  }
  .modal-topbar-left{ display:flex; align-items:center; gap:10px; font-size:.8rem; color:var(--ink-soft); }
  .modal-actions{ display:flex; align-items:center; gap:8px; }
  .modal-btn{
    font:inherit; font-size:.78rem; font-weight:600; color:var(--ink-soft);
    background:var(--bg-card); border:1px solid var(--line-strong);
    border-radius:7px; padding:6px 11px; cursor:pointer; text-decoration:none;
  }
  .modal-close{
    font:inherit; font-size:1.1rem; color:var(--ink-soft);
    background:transparent; border:none; width:32px; height:32px; cursor:pointer;
  }
  .modal-scroll{ padding:32px 36px 40px; overflow-y:auto; }
  .modal-title{ font-size:1.55rem; font-weight:800; line-height:1.38; margin:0 0 14px; }
  .modal-tags{
    display:flex; gap:6px; flex-wrap:wrap;
    margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--line);
  }
  .markdown-body{
    font-size:.95rem;
    line-height:1.75;
    color:var(--ink);
    white-space:pre-wrap;
    word-break:keep-all;
  }
  .modal-BottomNav{
    display:flex; justify-content:space-between; gap:12px;
    padding:14px 24px; border-top:1px solid var(--line); background:var(--bg-page);
  }

  footer{
    max-width:1280px; margin:0 auto; padding:0 24px 64px;
    display:flex; justify-content:center; gap:20px; font-size:.86rem;
  }
  footer a{ color:var(--ink-soft); text-decoration:none; font-weight:500; }

  @media (max-width:860px){
    .blog-layout{ grid-template-columns:1fr; gap:20px; }
    .blog-sidebar{ position:static; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="topbar-brand" href="../index.html">이준석</a>
      <nav class="topbar-links">
        <a href="./lab.html">Lab</a>
        <a href="../index.html">Home</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="blog-hero">
      <div>
        <p class="page-eyebrow">Engineering & Insight Log</p>
        <h1 class="page-title">지식 아카이브</h1>
        <p class="page-lead">인프라·클라우드·자동화 엔지니어링 노트와 일상에서 얻은 구조적 인사이트를 기록합니다.</p>
      </div>
      <a class="btn-primary" href="https://github.com/jjunstone/SSD/issues/new" target="_blank" rel="noopener">✎ 새 아티클 작성</a>
    </section>

    <div class="blog-layout">
      <aside class="blog-sidebar">
        <div class="sidebar-group">
          <div class="sidebar-heading">Overview</div>
          <div class="sidebar-nav" id="navOverview"></div>
        </div>
        <div class="sidebar-group">
          <div class="sidebar-heading">Engineering</div>
          <div class="sidebar-nav" id="navTech"></div>
        </div>
        <div class="sidebar-group">
          <div class="sidebar-heading">Perspective</div>
          <div class="sidebar-nav" id="navInsight"></div>
        </div>
      </aside>

      <section class="blog-feed">
        <div class="feed-toolbar">
          <div class="notes-search">
            <input id="notesSearch" type="text" placeholder="제목, 본문, 키워드 검색">
          </div>
          <span class="notes-count" id="notesCount"></span>
          <div class="view-toggle" id="viewToggle">
            <button type="button" class="view-btn active" data-view="list">목록형</button>
            <button type="button" class="view-btn" data-view="grid">카드형</button>
          </div>
        </div>

        <div class="notes-state show" id="notesLoading">
          <span>GitHub(jjunstone/SSD)에서 이슈를 불러오는 중…</span>
        </div>
        <div class="notes-state" id="notesError">
          <strong id="notesErrorTitle">포스트를 불러오지 못했습니다.</strong>
          <span id="notesErrorMsg"></span>
        </div>
        <div class="notes-state" id="notesEmpty">
          <span id="notesEmptyMsg">조건에 맞는 아티클이 없습니다.</span>
        </div>

        <div class="notes-board list-view" id="notesBoard"></div>
      </section>
    </div>
  </main>

  <div class="modal-backdrop" id="articleModal" role="dialog" aria-modal="true">
    <div class="modal-dialog">
      <div class="modal-topbar">
        <div class="modal-topbar-left">
          <span class="post-issue" id="modalIssueNum">#0</span>
          <span id="modalDate"></span>
        </div>
        <div class="modal-actions">
          <a class="modal-btn" id="modalGithubLink" href="#" target="_blank" rel="noopener">GitHub 원문 ↗</a>
          <button type="button" class="modal-close" id="modalCloseBtn">✕</button>
        </div>
      </div>
      <div class="modal-scroll" id="modalScroll">
        <h2 class="modal-title" id="modalTitle"></h2>
        <div class="modal-tags" id="modalTags"></div>
        <div class="markdown-body" id="modalBody"></div>
      </div>
      <div class="modal-BottomNav">
        <button type="button" class="modal-btn" id="prevNoteBtn">← 이전 글</button>
        <button type="button" class="modal-btn" id="nextNoteBtn">다음 글 →</button>
      </div>
    </div>
  </div>

  <footer>
    <a href="mailto:happyday7190@gmail.com">Email</a>
    <a href="../etc/files/resume.html" target="_blank" rel="noopener">Resume 다운로드</a>
  </footer>

  <script>
  (function(){
    var API_URL = "https://api.github.com/repos/jjunstone/SSD/issues?state=all&per_page=100";
    var INSIGHT_WORDS = ["insight", "etc", "생각", "일상", "유튜브", "독서", "축구", "경제", "부동산"];

    var board = document.getElementById("notesBoard");
    var navOverview = document.getElementById("navOverview");
    var navTech = document.getElementById("navTech");
    var navInsight = document.getElementById("navInsight");
    var loadingEl = document.getElementById("notesLoading");
    var errorEl = document.getElementById("notesError");
    var errorTitleEl = document.getElementById("notesErrorTitle");
    var errorMsgEl = document.getElementById("notesErrorMsg");
    var emptyEl = document.getElementById("notesEmpty");
    var emptyMsgEl = document.getElementById("notesEmptyMsg");
    var countEl = document.getElementById("notesCount");
    var searchInput = document.getElementById("notesSearch");
    var viewToggle = document.getElementById("viewToggle");

    var modal = document.getElementById("articleModal");
    var modalIssueNum = document.getElementById("modalIssueNum");
    var modalDate = document.getElementById("modalDate");
    var modalTitle = document.getElementById("modalTitle");
    var modalTags = document.getElementById("modalTags");
    var modalBody = document.getElementById("modalBody");
    var modalScroll = document.getElementById("modalScroll");
    var modalGithubLink = document.getElementById("modalGithubLink");
    var modalCloseBtn = document.getElementById("modalCloseBtn");
    var prevNoteBtn = document.getElementById("prevNoteBtn");
    var nextNoteBtn = document.getElementById("nextNoteBtn");

    var allNotes = [];
    var filteredNotes = [];
    var activeFilter = "ALL";
    var currentModalIndex = -1;

    function formatDate(iso){
      if (!iso) return "";
      return String(iso).slice(0, 10).split("-").join(".");
    }

    function isInsightLabel(name){
      var lower = String(name || "").toLowerCase();
      for (var i = 0; i < INSIGHT_WORDS.length; i++) {
        if (lower.indexOf(INSIGHT_WORDS[i]) !== -1) return true;
      }
      return false;
    }

    function cleanTitleText(t){
      var s = String(t || "");
      if (s.indexOf("질문:") === 0) {
        return s.slice(3).trim();
      }
      return s;
    }

    function createCatBtn(label, count, filterVal){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "cat-btn" + (activeFilter === filterVal ? " active" : "");
      btn.setAttribute("data-filter", filterVal);

      var spanName = document.createElement("span");
      spanName.textContent = label;

      var spanCount = document.createElement("span");
      spanCount.className = "cat-count";
      spanCount.textContent = String(count);

      btn.appendChild(spanName);
      btn.appendChild(spanCount);
      btn.addEventListener("click", function(){
        activeFilter = filterVal;
        renderSidebar();
        renderBoard();
      });
      return btn;
    }

    function renderSidebar(){
      navOverview.innerHTML = "";
      navTech.innerHTML = "";
      navInsight.innerHTML = "";

      var techCounts = {};
      var insightCounts = {};
      var techTotal = 0;
      var insightTotal = 0;

      for (var i = 0; i < allNotes.length; i++) {
        var n = allNotes[i];
        var hasInsight = false;
        for (var j = 0; j < n.labels.length; j++) {
          var lname = n.labels[j].name;
          if (isInsightLabel(lname)) {
            hasInsight = true;
            insightCounts[lname] = (insightCounts[lname] || 0) + 1;
          } else {
            techCounts[lname] = (techCounts[lname] || 0) + 1;
          }
        }
        if (hasInsight) insightTotal++; else techTotal++;
      }

      navOverview.appendChild(createCatBtn("전체 아티클", allNotes.length, "ALL"));
      navTech.appendChild(createCatBtn("기술 노트 전체", techTotal, "TECH_ALL"));

      var techKeys = Object.keys(techCounts);
      for (var k = 0; k < techKeys.length; k++) {
        var tName = techKeys[k];
        navTech.appendChild(createCatBtn("# " + tName, techCounts[tName], "LABEL:" + tName));
      }

      navInsight.appendChild(createCatBtn("인사이트 전체", insightTotal, "INSIGHT_ALL"));
      var inKeys = Object.keys(insightCounts);
      for (var m = 0; m < inKeys.length; m++) {
        var iName = inKeys[m];
        navInsight.appendChild(createCatBtn("# " + iName, insightCounts[iName], "LABEL:" + iName));
      }
    }

    function renderBoard(){
      var q = searchInput.value.trim().toLowerCase();
      filteredNotes = [];

      for (var i = 0; i < allNotes.length; i++) {
        var n = allNotes[i];
        var matchSector = true;

        if (activeFilter === "TECH_ALL") {
          matchSector = !n.labels.some(function(l){ return isInsightLabel(l.name); });
        } else if (activeFilter === "INSIGHT_ALL") {
          matchSector = n.labels.some(function(l){ return isInsightLabel(l.name); });
        } else if (activeFilter.indexOf("LABEL:") === 0) {
          var target = activeFilter.slice(6);
          matchSector = n.labels.some(function(l){ return l.name === target; });
        }

        var combined = (n.title + " " + n.body).toLowerCase();
        var matchQuery = !q || combined.indexOf(q) !== -1;

        if (matchSector && matchQuery) {
          filteredNotes.push(n);
        }
      }

      board.innerHTML = "";

      if (filteredNotes.length === 0) {
        emptyEl.classList.add("show");
        countEl.textContent = "0개 아티클";
        return;
      }

      emptyEl.classList.remove("show");
      countEl.textContent = "총 " + filteredNotes.length + "개 아티클";

      for (var idx = 0; idx < filteredNotes.length; idx++) {
        var item = filteredNotes[idx];
        var card = document.createElement("article");
        card.className = "post-item";

        var meta = document.createElement("div");
        meta.className = "post-meta";
        var issueSpan = document.createElement("span");
        issueSpan.className = "post-issue";
        issueSpan.textContent = "#" + item.number;
        var dateSpan = document.createElement("span");
        dateSpan.textContent = formatDate(item.createdAt);
        meta.appendChild(issueSpan);
        meta.appendChild(dateSpan);

        var h3 = document.createElement("h3");
        h3.className = "post-title";
        h3.textContent = cleanTitleText(item.title);

        var excerpt = document.createElement("div");
        excerpt.className = "post-excerpt";
        excerpt.textContent = item.body || "(내용 없음)";

        var footer = document.createElement("div");
        footer.className = "post-footer";
        var tagsWrap = document.createElement("div");
        tagsWrap.className = "post-tags";
        for (var t = 0; t < item.labels.length; t++) {
          var chip = document.createElement("span");
          chip.className = "note-label-chip";
          chip.textContent = "#" + item.labels[t].name;
          tagsWrap.appendChild(chip);
        }
        var moreSpan = document.createElement("span");
        moreSpan.className = "post-more";
        moreSpan.textContent = "읽기 →";

        footer.appendChild(tagsWrap);
        footer.appendChild(moreSpan);

        card.appendChild(meta);
        card.appendChild(h3);
        card.appendChild(excerpt);
        card.appendChild(footer);

        (function(capturedIdx){
          card.addEventListener("click", function(){
            openModal(capturedIdx);
          });
        })(idx);

        board.appendChild(card);
      }
    }

    function openModal(idx){
      if (idx < 0 || idx >= filteredNotes.length) return;
      currentModalIndex = idx;
      var n = filteredNotes[idx];

      modalIssueNum.textContent = "#" + n.number;
      modalDate.textContent = formatDate(n.createdAt);
      modalTitle.textContent = cleanTitleText(n.title);
      modalGithubLink.href = n.url;

      modalTags.innerHTML = "";
      for (var i = 0; i < n.labels.length; i++) {
        var chip = document.createElement("span");
        chip.className = "note-label-chip";
        chip.textContent = "#" + n.labels[i].name;
        modalTags.appendChild(chip);
      }

      modalBody.textContent = n.body || "(내용 없음)";
      prevNoteBtn.disabled = idx <= 0;
      nextNoteBtn.disabled = idx >= filteredNotes.length - 1;

      modal.classList.add("open");
      document.body.classList.add("modal-open");
      modalScroll.scrollTop = 0;
    }

    function closeModal(){
      modal.classList.remove("open");
      document.body.classList.remove("modal-open");
    }

    viewToggle.addEventListener("click", function(e){
      var btn = e.target.closest(".view-btn");
      if (!btn) return;
      var buttons = viewToggle.querySelectorAll(".view-btn");
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].classList.remove("active");
      }
      btn.classList.add("active");
      var mode = btn.getAttribute("data-view");
      board.className = "notes-board " + (mode === "grid" ? "grid-view" : "list-view");
    });

    modalCloseBtn.addEventListener("click", closeModal);
    modal.addEventListener("click", function(e){
      if (e.target === modal) closeModal();
    });
    prevNoteBtn.addEventListener("click", function(){
      if (currentModalIndex > 0) openModal(currentModalIndex - 1);
    });
    nextNoteBtn.addEventListener("click", function(){
      if (currentModalIndex < filteredNotes.length - 1) openModal(currentModalIndex + 1);
    });

    searchInput.addEventListener("input", renderBoard);

    fetch(API_URL)
      .then(function(res){
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function(data){
        var list = Array.isArray(data) ? data : [];
        allNotes = [];
        for (var i = 0; i < list.length; i++) {
          var item = list[i];
          if (item.pull_request) continue;
          allNotes.push({
            number: item.number,
            title: item.title || "",
            body: item.body || "",
            url: item.html_url || "",
            labels: Array.isArray(item.labels) ? item.labels : [],
            createdAt: item.created_at || ""
          });
        }
        loadingEl.classList.remove("show");
        renderSidebar();
        renderBoard();
      })
      .catch(function(err){
        loadingEl.classList.remove("show");
        errorMsgEl.textContent = String(err && err.message ? err.message : "네트워크 오류");
        errorEl.classList.add("show");
      });
  })();
  </script>
</body>
</html>
