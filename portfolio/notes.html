<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archive | 이준석</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<style>
  :root{
    --ink:#0f172a;
    --ink-soft:#475569;
    --ink-faint:#94a3b8;
    --line:#e2e8f0;
    --line-strong:#cbd5e1;
    --navy:#173c78;
    --blue:#2563eb;
    --blue-soft:#eff4fd;
    --bg-page:#f8fafc;
    --bg-card:#ffffff;
    --font-main:"Pretendard","Gowun Dodum","Malgun Gothic",sans-serif;
    --font-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background-color:var(--bg-page);
    color:var(--ink);
    font-family:var(--font-main);
    -webkit-font-smoothing:antialiased;
  }
  body.modal-open{ overflow:hidden; }

  .topbar{
    position:sticky; top:0; z-index:40;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(14px) saturate(140%);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    max-width:1280px;
    margin:0 auto;
    padding:18px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .topbar-brand{
    font-weight:800;
    text-decoration:none;
    font-size:1.18rem;
    letter-spacing:.02em;
    color:var(--navy);
  }
  .topbar-links{ display:flex; gap:26px; }
  .topbar-links a{
    position:relative;
    color:var(--ink-soft);
    text-decoration:none;
    font-size:.95rem;
    font-weight:600;
    padding-bottom:2px;
  }
  .topbar-links a::after{
    content:"";
    position:absolute; left:0; right:100%; bottom:-2px;
    height:1.5px;
    background:var(--navy);
    transition:right .22s cubic-bezier(.4,0,.2,1);
  }
  .topbar-links a:hover::after{ right:0; }
  .topbar-links a:hover{ color:var(--navy); }

  main{
    max-width:1280px;
    margin:0 auto;
    padding:36px 24px 96px;
  }

  .blog-hero{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    padding-bottom:24px;
    margin-bottom:28px;
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .page-eyebrow{
    display:inline-block;
    font-size:.73rem;
    font-weight:700;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--navy);
    background:var(--blue-soft);
    padding:4px 10px;
    border-radius:6px;
    margin:0 0 8px;
  }
  .page-title{
    font-size:1.95rem;
    font-weight:800;
    letter-spacing:-.02em;
    margin:0 0 6px;
  }
  .page-lead{
    font-size:.93rem;
    line-height:1.6;
    color:var(--ink-soft);
    margin:0;
  }
  .btn-primary{
    font:inherit;
    font-size:.83rem;
    font-weight:700;
    color:#ffffff;
    background:var(--navy);
    border:1px solid var(--navy);
    border-radius:9px;
    padding:10px 16px;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:6px;
    transition:background .15s ease, transform .15s ease;
    white-space:nowrap;
  }
  .btn-primary:hover{
    background:#102a56;
    transform:translateY(-1px);
  }

  .blog-layout{
    display:grid;
    grid-template-columns:230px 1fr;
    gap:32px;
    align-items:start;
  }

  .blog-sidebar{
    position:sticky;
    top:84px;
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 14px;
  }
  .sidebar-group{
    margin-bottom:18px;
    padding-bottom:16px;
    border-bottom:1px solid var(--line);
  }
  .sidebar-group:last-child{
    margin-bottom:0;
    padding-bottom:0;
    border-bottom:none;
  }
  .sidebar-heading{
    font-size:.71rem;
    font-weight:800;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-faint);
    padding:0 10px;
    margin:0 0 6px;
  }
  .sidebar-nav{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .cat-btn{
    width:100%;
    font:inherit;
    font-size:.85rem;
    font-weight:600;
    color:var(--ink-soft);
    background:transparent;
    border:none;
    border-radius:8px;
    padding:8px 10px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    text-align:left;
    transition:all .14s ease;
  }
  .cat-btn:hover{
    background:var(--bg-page);
    color:var(--navy);
  }
  .cat-btn.active{
    background:var(--blue-soft);
    color:var(--navy);
    font-weight:700;
  }
  .cat-count{
    font-family:var(--font-mono);
    font-size:.73rem;
    color:var(--ink-faint);
    background:var(--bg-page);
    padding:1px 7px;
    border-radius:999px;
  }
  .cat-btn.active .cat-count{
    background:#ffffff;
    color:var(--navy);
  }

  .feed-toolbar{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .notes-search{
    flex:1;
    min-width:220px;
    position:relative;
  }
  .notes-search input{
    width:100%;
    padding:10px 36px 10px 36px;
    border:1px solid var(--line-strong);
    border-radius:10px;
    font:inherit;
    font-size:.88rem;
    color:var(--ink);
    background:var(--bg-card);
  }
  .notes-search input:focus{
    outline:none;
    border-color:var(--navy);
    box-shadow:0 0 0 3px rgba(23,60,120,.1);
  }
  .notes-search-icon{
    position:absolute; left:12px; top:50%;
    transform:translateY(-50%);
    color:var(--ink-faint);
    font-size:.88rem;
    pointer-events:none;
  }
  .notes-search-kbd{
    position:absolute; right:10px; top:50%;
    transform:translateY(-50%);
    font-family:var(--font-mono);
    font-size:.7rem;
    color:var(--ink-faint);
    background:var(--bg-page);
    border:1px solid var(--line);
    border-radius:4px;
    padding:1px 6px;
    pointer-events:none;
  }
  .notes-count{
    font-size:.84rem;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .notes-count b{ color:var(--navy); }

  .view-toggle{
    display:inline-flex;
    background:var(--bg-card);
    border:1px solid var(--line-strong);
    border-radius:8px;
    padding:2px;
  }
  .view-btn{
    font:inherit;
    font-size:.76rem;
    font-weight:600;
    color:var(--ink-soft);
    background:transparent;
    border:none;
    padding:5px 10px;
    border-radius:6px;
    cursor:pointer;
  }
  .view-btn.active{
    background:var(--navy);
    color:#ffffff;
  }

  .notes-board.list-view{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .notes-board.grid-view{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(310px, 1fr));
    gap:18px;
  }

  .post-item{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px 24px;
    cursor:pointer;
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    display:flex;
    justify-content:space-between;
    align-items:stretch;
    gap:22px;
  }
  .post-item:hover,
  .post-item:focus-visible{
    outline:none;
    transform:translateY(-2px);
    box-shadow:0 12px 24px -10px rgba(15,23,42,.1);
    border-color:var(--line-strong);
  }
  .notes-board.grid-view .post-item{
    flex-direction:column;
    padding:18px 20px;
    gap:14px;
  }

  .post-main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
  }
  .post-meta{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:.75rem;
    color:var(--ink-faint);
    margin-bottom:8px;
  }
  .post-issue{
    font-family:var(--font-mono);
    font-weight:700;
    color:var(--navy);
    background:var(--blue-soft);
    padding:1px 6px;
    border-radius:4px;
  }
  .post-title{
    font-size:1.08rem;
    font-weight:800;
    color:var(--ink);
    margin:0 0 8px;
    line-height:1.42;
    word-break:keep-all;
  }
  .post-tldr{
    font-size:.82rem;
    font-weight:600;
    color:var(--navy);
    background:var(--blue-soft);
    border-left:3px solid var(--navy);
    padding:6px 10px;
    border-radius:0 6px 6px 0;
    margin:0 0 8px;
    word-break:keep-all;
  }
  .post-excerpt{
    font-size:.86rem;
    line-height:1.6;
    color:var(--ink-soft);
    margin:0 0 12px;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    word-break:keep-all;
  }
  .post-tags{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-top:auto;
  }
  .note-label-chip{
    font-size:.72rem;
    font-weight:600;
    color:var(--ink-soft);
    background:var(--bg-page);
    border:1px solid var(--line);
    padding:2px 8px;
    border-radius:6px;
  }

  .post-thumb-box{
    width:168px;
    height:116px;
    border-radius:10px;
    border:1px solid var(--line);
    background:#f8fafc;
    padding:6px;
    flex-shrink:0;
    align-self:center;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .post-thumb{
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    object-fit:contain;
    border-radius:4px;
    transition:transform .25s ease;
  }
  .post-item:hover .post-thumb{
    transform:scale(1.04);
  }
  .post-img-count{
    position:absolute;
    right:6px;
    bottom:6px;
    font-family:var(--font-mono);
    font-size:.68rem;
    font-weight:700;
    color:#ffffff;
    background:rgba(15,23,42,.72);
    padding:2px 6px;
    border-radius:4px;
  }
  .notes-board.grid-view .post-thumb-box{
    width:100%;
    height:160px;
    order:-1;
  }

  .notes-state{
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:12px;
    padding:72px 24px;
    background:var(--bg-card);
    border:1px dashed var(--line-strong);
    border-radius:14px;
    color:var(--ink-soft);
    font-size:.92rem;
    text-align:center;
  }
  .notes-state.show{ display:flex; }
  .notes-spinner{
    width:24px; height:24px;
    border:2.5px solid var(--line);
    border-top-color:var(--navy);
    border-radius:50%;
    animation:notes-spin .8s linear infinite;
  }
  @keyframes notes-spin{ to{ transform:rotate(360deg); } }

  .modal-backdrop{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(15,23,42,.55);
    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .modal-backdrop.open{ display:flex; }
  .modal-dialog{
    background:var(--bg-card);
    width:100%;
    max-width:840px;
    max-height:90vh;
    border-radius:16px;
    border:1px solid var(--line);
    box-shadow:0 25px 50px -12px rgba(15,23,42,.28);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .modal-topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 24px;
    border-bottom:1px solid var(--line);
    background:var(--bg-page);
  }
  .modal-topbar-left{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:.8rem;
    color:var(--ink-soft);
  }
  .modal-actions{ display:flex; align-items:center; gap:8px; }
  .modal-btn{
    font:inherit;
    font-size:.78rem;
    font-weight:600;
    color:var(--ink-soft);
    background:var(--bg-card);
    border:1px solid var(--line-strong);
    border-radius:7px;
    padding:6px 11px;
    cursor:pointer;
    text-decoration:none;
  }
  .modal-btn:hover{ border-color:var(--navy); color:var(--navy); background:var(--blue-soft); }
  .modal-close{
    font:inherit; font-size:1.1rem; color:var(--ink-soft);
    background:transparent; border:none; width:32px; height:32px;
    border-radius:8px; cursor:pointer;
  }
  .modal-scroll{ padding:32px 36px 40px; overflow-y:auto; }
  .modal-title{
    font-size:1.6rem; font-weight:800; line-height:1.38;
    margin:0 0 14px; word-break:keep-all;
  }
  .modal-tags{
    display:flex; gap:6px; flex-wrap:wrap;
    margin-bottom:24px; padding-bottom:18px; border-bottom:1px solid var(--line);
  }

  .markdown-body{ font-size:.96rem; line-height:1.8; color:#1e293b; word-break:keep-all; overflow-wrap:anywhere; }
  .markdown-body h2{ font-size:1.18rem; padding-bottom:8px; border-bottom:1px solid var(--line); margin:28px 0 12px; }
  .markdown-body h3{ font-size:1.04rem; color:var(--navy); margin:22px 0 10px; }
  .markdown-body p{ margin:0 0 14px; }
  .markdown-body ul{ margin:0 0 16px; padding-left:22px; }
  .markdown-body li{ margin:4px 0; }
  .markdown-body blockquote{
    margin:16px 0; padding:12px 16px; border-left:4px solid var(--navy);
    background:var(--blue-soft); border-radius:0 8px 8px 0; color:var(--navy); font-weight:600;
  }
  .markdown-body code{
    font-family:var(--font-mono); font-size:.84em; background:#f1f5f9;
    border:1px solid #e2e8f0; padding:2px 6px; border-radius:5px;
  }
  .code-block-wrap{ position:relative; margin:16px 0; }
  .code-copy-btn{
    position:absolute; top:8px; right:8px; font-size:.72rem; font-weight:600;
    color:#cbd5e1; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2);
    border-radius:6px; padding:4px 9px; cursor:pointer;
  }
  .markdown-body pre{
    font-family:var(--font-mono); font-size:.84rem; line-height:1.6;
    background:#0f172a; color:#f8fafc; padding:16px 18px; border-radius:10px; overflow-x:auto; margin:0;
  }
  .markdown-body pre code{ background:none; border:none; color:inherit; padding:0; }
  .markdown-body img{
    display:block;
    max-width:100%;
    max-height:560px;
    width:auto;
    height:auto;
    margin:20px auto;
    padding:8px;
    background:#f8fafc;
    border:1px solid var(--line);
    border-radius:10px;
    cursor:zoom-in;
    box-shadow:0 4px 14px rgba(15,23,42,.05);
  }

  .modal-BottomNav{
    display:flex; justify-content:space-between; gap:12px;
    padding:14px 24px; border-top:1px solid var(--line); background:var(--bg-page);
  }

  .lightbox{
    position:fixed; inset:0; z-index:200; background:rgba(15,23,42,.9);
    display:none; align-items:center; justify-content:center; padding:24px; cursor:zoom-out;
  }
  .lightbox.open{ display:flex; }
  .lightbox img{ max-width:95vw; max-height:92vh; border-radius:8px; background:#ffffff; }

  footer{
    max-width:1280px; margin:0 auto; padding:0 24px 64px;
    display:flex; justify-content:center; gap:20px; font-size:.86rem;
  }
  footer a{ color:var(--ink-soft); text-decoration:none; font-weight:500; }

  @media (max-width:860px){
    .blog-layout{ grid-template-columns:1fr; gap:20px; }
    .blog-sidebar{ position:static; }
  }
  @media (max-width:640px){
    .post-item{ flex-direction:column; gap:14px; }
    .post-thumb-box{ width:100%; height:150px; order:-1; }
    .modal-backdrop{ padding:0; align-items:flex-end; }
    .modal-dialog{ max-height:94vh; border-radius:16px 16px 0 0; }
    .modal-scroll{ padding:22px 20px 32px; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="topbar-brand" href="../index.html">이준석</a>
      <nav class="topbar-links">
        <a href="./lab.html">Lab</a>
        <a href="../index.html">Home</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="blog-hero">
      <div>
        <p class="page-eyebrow">Engineering & Insight Log</p>
        <h1 class="page-title">지식 아카이브</h1>
        <p class="page-lead">인프라·클라우드·자동화 엔지니어링 노트와 일상에서 얻은 구조적 인사이트를 한 줄의 결론과 함께 기록합니다.</p>
      </div>
      <a class="btn-primary" href="https://github.com/jjunstone/SSD/issues/new?title=%5B%EC%A3%BC%EC%A0%9C%5D+%ED%95%B5%EC%8B%AC+%EC%A0%9C%EB%AA%A9%EC%9D%84+%EC%9E%85%EB%A0%A5%ED%95%98%EC%84%B8%EC%9A%94&body=%23%23+1.+%ED%95%9C+%EC%A4%84+%EC%A0%95%EC%9D%98+(TL%3BDR)%0A%3E+%EB%82%B4+%EC%96%B8%EC%96%B4%EB%A1%9C+%EB%8B%A4%EC%8B%9C+%EC%A0%95%EC%9D%98%ED%95%9C+%ED%95%B5%EC%8B%AC+%EA%B2%B0%EB%A1%A0+%ED%95%9C+%EB%AC%B8%EC%9E%A5%0A%0A%23%23+2.+%EC%99%9C+%EC%B0%BE%EC%95%84%EB%B4%A4%EB%82%98%3F+(Context)%0A-%20%0A%0A%23%23+3.+%ED%95%B5%EC%8B%AC+%EB%A9%94%EC%BB%A4%EB%8B%88%EC%A6%98+(How+it+works)%0A-%20%0A%0A%23%23+4.+%EC%9D%B8%EC%82%AC%EC%9D%B4%ED%8A%B8+%26+%EC%A0%81%EC%9A%A9%EC%A0%90+(Takeaway)%0A-%20" target="_blank" rel="noopener">✎ 새 아티클 작성</a>
    </section>

    <div class="blog-layout">
      <aside class="blog-sidebar" id="sidebarNav"></aside>

      <section class="blog-feed">
        <div class="feed-toolbar">
          <div class="notes-search">
            <span class="notes-search-icon">⌕</span>
            <input id="notesSearch" type="text" placeholder="제목, 한 줄 정의, 본문 검색" disabled>
            <span class="notes-search-kbd">/</span>
          </div>
          <span class="notes-count" id="notesCount"></span>
          <div class="view-toggle" role="group" aria-label="보기 방식 전환">
            <button type="button" class="view-btn active" data-view="list">목록형</button>
            <button type="button" class="view-btn" data-view="grid">카드형</button>
          </div>
        </div>

        <div class="notes-state show" id="notesLoading">
          <span class="notes-spinner"></span>
          <span>아카이브 데이터를 불러오는 중…</span>
        </div>
        <div class="notes-state" id="notesError">
          <span id="notesErrorMsg">포스트를 불러오지 못했습니다. 잠시 후 다시 시도해주세요.</span>
        </div>
        <div class="notes-state" id="notesEmpty">
          <span>조건에 맞는 아티클이 없습니다.</span>
        </div>

        <div class="notes-board list-view" id="notesBoard"></div>
      </section>
    </div>
  </main>

  <div class="modal-backdrop" id="articleModal" role="dialog" aria-modal="true">
    <div class="modal-dialog">
      <div class="modal-topbar">
        <div class="modal-topbar-left">
          <span class="post-issue" id="modalIssueNum">#0</span>
          <span id="modalDate"></span>
        </div>
        <div class="modal-actions">
          <button type="button" class="modal-btn" id="copyLinkBtn">🔗 링크 복사</button>
          <a class="modal-btn" id="modalGithubLink" href="#" target="_blank" rel="noopener">GitHub 원문 ↗</a>
          <button type="button" class="modal-close" id="modalCloseBtn">✕</button>
        </div>
      </div>
      <div class="modal-scroll" id="modalScroll">
        <h2 class="modal-title" id="modalTitle"></h2>
        <div class="modal-tags" id="modalTags"></div>
        <div class="markdown-body" id="modalBody"></div>
      </div>
      <div class="modal-BottomNav">
        <button type="button" class="modal-btn" id="prevNoteBtn">← 이전 글</button>
        <button type="button" class="modal-btn" id="nextNoteBtn">다음 글 →</button>
      </div>
    </div>
  </div>

  <div class="lightbox" id="lightbox">
    <img id="lightboxImg" src="" alt="확대 이미지">
  </div>

  <footer>
    <a href="mailto:happyday7190@gmail.com">Email</a>
    <a href="../etc/files/resume.html" target="_blank" rel="noopener">Resume 다운로드</a>
  </footer>

  <script>
  (function(){
    var REPO = "jjunstone/SSD";
    var CACHE_KEY = "archive_issues_cache_v1";
    var INSIGHT_LABELS = ["insight", "etc", "생각", "일상", "유튜브", "독서", "축구", "경제", "부동산"];

    var board = document.getElementById("notesBoard");
    var sidebarNav = document.getElementById("sidebarNav");
    var loadingEl = document.getElementById("notesLoading");
    var errorEl = document.getElementById("notesError");
    var errorMsgEl = document.getElementById("notesErrorMsg");
    var emptyEl = document.getElementById("notesEmpty");
    var countEl = document.getElementById("notesCount");
    var searchInput = document.getElementById("notesSearch");

    var modal = document.getElementById("articleModal");
    var modalIssueNum = document.getElementById("modalIssueNum");
    var modalDate = document.getElementById("modalDate");
    var modalTitle = document.getElementById("modalTitle");
    var modalTags = document.getElementById("modalTags");
    var modalBody = document.getElementById("modalBody");
    var modalScroll = document.getElementById("modalScroll");
    var modalGithubLink = document.getElementById("modalGithubLink");
    var modalCloseBtn = document.getElementById("modalCloseBtn");
    var copyLinkBtn = document.getElementById("copyLinkBtn");
    var prevNoteBtn = document.getElementById("prevNoteBtn");
    var nextNoteBtn = document.getElementById("nextNoteBtn");

    var lightbox = document.getElementById("lightbox");
    var lightboxImg = document.getElementById("lightboxImg");

    var allNotes = [];
    var filteredNotes = [];
    var activeFilter = "ALL";
    var currentModalIndex = -1;

    function esc(s){
      return String(s == null ? "" : s)
        .replace(/&/g,"&").replace(/</g,"<").replace(/>/g,">").replace(/"/g,""");
    }

    function formatDate(iso){
      var d = new Date(iso);
      if (isNaN(d.getTime())) return "";
      return d.getFullYear() + "." + String(d.getMonth()+1).padStart(2,"0") + "." + String(d.getDate()).padStart(2,"0");
    }

    function isInsightLabel(name){
      var lower = (name || "").toLowerCase();
      return INSIGHT_LABELS.some(function(k){ return lower.indexOf(k) !== -1; });
    }

    function extractAllImages(body){
      if (!body) return [];
      var urls = [];
      var mdRegex = /!\[[^\]]*\]\((https?:\/\/[^\s)]+)\)/gi;
      var htmlRegex = /<img[^>]+src=["'](https?:\/\/[^"']+)["']/gi;
      var m;
      while ((m = mdRegex.exec(body)) !== null) urls.push(m[1]);
      while ((m = htmlRegex.exec(body)) !== null) {
        if (urls.indexOf(m[1]) === -1) urls.push(m[1]);
      }
      return urls;
    }

    function extractTldr(body){
      if (!body) return "";
      var m = body.match(/^>\s*(.+)$/m);
      if (m && m[1].indexOf("내 언어로 다시 정의한") === -1) {
        return m[1].replace(/[*_`]/g, "").trim();
      }
      return "";
    }

    function extractCleanExcerpt(body){
      if (!body) return "내용이 없습니다.";
      return body
        .replace(/<!--[\s\S]*?-->/g, "")
        .replace(/^>\s*.+$/gm, "")
        .replace(/```[\s\S]*?```/g, "")
        .replace(/!\[[^\]]*\]\([^)]+\)/g, "")
        .replace(/<img[^>]*>/gi, "")
        .replace(/^#{1,6}\s+.*$/gm, "")
        .replace(/[*_`~>-]/g, "")
        .replace(/\s+/g, " ")
        .trim() || "다이어그램/이미지가 포함된 노트입니다. 클릭하여 확인하세요.";
    }

    // 외부 CDN 없이 100% 자체 동작하는 안전한 마크다운 파서
    function renderMarkdown(body){
      var raw = (body || "(내용 없음)").replace(/<!--[\s\S]*?-->/g, "");
      var codeBlocks = [];

      // 1. 코드블록 임시 분리 보호
      raw = raw.replace(/```([a-zA-Z0-9_-]*)\n?([\s\S]*?)```/g, function(_, lang, code){
        var idx = codeBlocks.length;
        codeBlocks.push("<pre><code>" + esc(code.trim()) + "</code></pre>");
        return "@@CODEBLOCK_" + idx + "@@";
      });

      var html = esc(raw);

      // 2. 마크다운 이미지 & HTML <img> 복원
      html = html.replace(/!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g, '<img src="$2" alt="$1" loading="lazy">');
      html = html.replace(/<img[^&]*?src="(https?:\/\/[^&]+?)"[^&]*?\/?>/gi, '<img src="$1" alt="첨부 이미지" loading="lazy">');

      // 3. 인라인 코드, 굵은 글씨, 링크
      html = html.replace(/`([^`\n]+)`/g, "<code>$1</code>");
      html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

      // 4. 줄 단위 블록 요소 처리 (제목, 인용구, 리스트)
      var lines = html.split(/\r?\n/);
      var out = [];
      var inList = false;

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        if (/^###\s+(.*)$/.test(line)) {
          if (inList) { out.push("</ul>"); inList = false; }
          out.push(line.replace(/^###\s+(.*)$/, "<h3>$1</h3>"));
        } else if (/^##?\s+(.*)$/.test(line)) {
          if (inList) { out.push("</ul>"); inList = false; }
          out.push(line.replace(/^##?\s+(.*)$/, "<h2>$1</h2>"));
        } else if (/^>\s*(.*)$/.test(line)) {
          if (inList) { out.push("</ul>"); inList = false; }
          out.push(line.replace(/^>\s*(.*)$/, "<blockquote>$1</blockquote>"));
        } else if (/^[-*]\s+(.*)$/.test(line)) {
          if (!inList) { out.push("<ul>"); inList = true; }
          out.push(line.replace(/^[-*]\s+(.*)$/, "<li>$1</li>"));
        } else if (/^@@CODEBLOCK_(\d+)@@$/.test(line.trim())) {
          if (inList) { out.push("</ul>"); inList = false; }
          out.push(line.trim());
        } else if (line.trim() === "") {
          if (inList) { out.push("</ul>"); inList = false; }
          out.push("");
        } else {
          if (inList) { out.push("</ul>"); inList = false; }
          out.push("<p>" + line + "</p>");
        }
      }
      if (inList) out.push("</ul>");

      var finalHtml = out.join("\n");
      // 5. 코드블록 복원
      finalHtml = finalHtml.replace(/@@CODEBLOCK_(\d+)@@/g, function(_, idx){
        return codeBlocks[Number(idx)] || "";
      });
      return finalHtml;
    }

    function renderSidebar(){
      var techCounts = {};
      var insightCounts = {};
      var techTotal = 0;
      var insightTotal = 0;

      allNotes.forEach(function(n){
        var hasInsight = n.labels.some(function(l){ return isInsightLabel(l.name); });
        if (hasInsight) insightTotal++; else techTotal++;

        n.labels.forEach(function(l){
          if (isInsightLabel(l.name)) {
            insightCounts[l.name] = (insightCounts[l.name] || 0) + 1;
          } else {
            techCounts[l.name] = (techCounts[l.name] || 0) + 1;
          }
        });
      });

      var html = '<div class="sidebar-group">' +
        '<div class="sidebar-heading">Overview</div>' +
        '<div class="sidebar-nav">' +
          '<button type="button" class="cat-btn' + (activeFilter === "ALL" ? " active" : "") + '" data-filter="ALL"><span>전체 아티클</span><span class="cat-count">' + allNotes.length + '</span></button>' +
        '</div>' +
      '</div>';

      html += '<div class="sidebar-group">' +
        '<div class="sidebar-heading">🛠 Engineering</div>' +
        '<div class="sidebar-nav">' +
          '<button type="button" class="cat-btn' + (activeFilter === "TECH_ALL" ? " active" : "") + '" data-filter="TECH_ALL"><span>기술 노트 전체</span><span class="cat-count">' + techTotal + '</span></button>';
      Object.keys(techCounts).forEach(function(name){
        var act = activeFilter === "LABEL:" + name ? " active" : "";
        html += '<button type="button" class="cat-btn' + act + '" data-filter="LABEL:' + esc(name) + '"><span># ' + esc(name) + '</span><span class="cat-count">' + techCounts[name] + '</span></button>';
      });
      html += '</div></div>';

      html += '<div class="sidebar-group">' +
        '<div class="sidebar-heading">💡 Perspective</div>' +
        '<div class="sidebar-nav">' +
          '<button type="button" class="cat-btn' + (activeFilter === "INSIGHT_ALL" ? " active" : "") + '" data-filter="INSIGHT_ALL"><span>인사이트 전체</span><span class="cat-count">' + insightTotal + '</span></button>';
      Object.keys(insightCounts).forEach(function(name){
        var act = activeFilter === "LABEL:" + name ? " active" : "";
        html += '<button type="button" class="cat-btn' + act + '" data-filter="LABEL:' + esc(name) + '"><span># ' + esc(name) + '</span><span class="cat-count">' + insightCounts[name] + '</span></button>';
      });
      html += '</div></div>';

      sidebarNav.innerHTML = html;
    }

    function render(){
      var q = searchInput.value.trim().toLowerCase();

      filteredNotes = allNotes.filter(function(n){
        var matchSector = true;
        if (activeFilter === "TECH_ALL") {
          matchSector = !n.labels.some(function(l){ return isInsightLabel(l.name); });
        } else if (activeFilter === "INSIGHT_ALL") {
          matchSector = n.labels.some(function(l){ return isInsightLabel(l.name); });
        } else if (activeFilter.indexOf("LABEL:") === 0) {
          var target = activeFilter.slice(6);
          matchSector = n.labels.some(function(l){ return l.name === target; });
        }
        var matchQuery = !q || (n.title + " " + n.body).toLowerCase().indexOf(q) !== -1;
        return matchSector && matchQuery;
      });

      if (filteredNotes.length === 0) {
        board.innerHTML = "";
        emptyEl.classList.add("show");
        countEl.textContent = "0개 아티클";
        return;
      }

      emptyEl.classList.remove("show");
      countEl.innerHTML = "<b>" + filteredNotes.length + "</b>개 아티클";

      board.innerHTML = filteredNotes.map(function(n, idx){
        var title = esc(n.title.replace(/^질문:\s*/, ""));
        var labelsHtml = n.labels.map(function(l){
          return '<span class="note-label-chip">#' + esc(l.name) + '</span>';
        }).join("");
        var tldrHtml = n.tldr ? '<div class="post-tldr">💡 ' + esc(n.tldr) + '</div>' : "";

        var thumbHtml = "";
        if (n.images.length > 0) {
          var extraCount = n.images.length > 1 ? '<span class="post-img-count">+' + (n.images.length - 1) + '</span>' : '';
          thumbHtml = '<div class="post-thumb-box">' +
            '<img class="post-thumb" src="' + esc(n.images[0]) + '" alt="미리보기" loading="lazy" onerror="this.parentElement.style.display=\'none\'">' +
            extraCount +
          '</div>';
        }

        return '<article class="post-item" data-index="' + idx + '" tabindex="0">' +
          '<div class="post-main">' +
            '<div class="post-meta">' +
              '<span class="post-issue">#' + n.number + '</span>' +
              '<span>' + formatDate(n.createdAt) + '</span>' +
            '</div>' +
            '<h3 class="post-title">' + title + '</h3>' +
            tldrHtml +
            '<p class="post-excerpt">' + esc(n.excerpt) + '</p>' +
            '<div class="post-tags">' + labelsHtml + '</div>' +
          '</div>' +
          thumbHtml +
        '</article>';
      }).join("");
    }

    function openModalByIndex(idx){
      if (idx < 0 || idx >= filteredNotes.length) return;
      currentModalIndex = idx;
      var n = filteredNotes[idx];

      modalIssueNum.textContent = "#" + n.number;
      modalDate.textContent = formatDate(n.createdAt);
      modalTitle.textContent = n.title.replace(/^질문:\s*/, "");
      modalGithubLink.href = n.url;
      modalTags.innerHTML = n.labels.map(function(l){
        return '<span class="note-label-chip">#' + esc(l.name) + '</span>';
      }).join("");
      modalTags.style.display = n.labels.length ? "flex" : "none";

      modalBody.innerHTML = renderMarkdown(n.body);

      modalBody.querySelectorAll("pre").forEach(function(pre){
        var wrap = document.createElement("div");
        wrap.className = "code-block-wrap";
        pre.parentNode.insertBefore(wrap, pre);
        wrap.appendChild(pre);
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "code-copy-btn";
        btn.textContent = "Copy";
        btn.addEventListener("click", function(){
          navigator.clipboard.writeText(pre.innerText).then(function(){
            btn.textContent = "Copied!";
            setTimeout(function(){ btn.textContent = "Copy"; }, 1500);
          });
        });
        wrap.appendChild(btn);
      });

      prevNoteBtn.disabled = idx <= 0;
      nextNoteBtn.disabled = idx >= filteredNotes.length - 1;
      modal.classList.add("open");
      document.body.classList.add("modal-open");
      modalScroll.scrollTop = 0;
      history.replaceState(null, "", "#issue-" + n.number);
    }

    function closeModal(){
      modal.classList.remove("open");
      document.body.classList.remove("modal-open");
      if (location.hash.indexOf("#issue-") === 0) {
        history.replaceState(null, "", location.pathname + location.search);
      }
    }

    function applyData(data){
      allNotes = (Array.isArray(data) ? data : [])
        .filter(function(n){ return !n.pull_request; })
        .map(function(n){
          var rawBody = n.body || "";
          return {
            number: n.number,
            title: n.title || "",
            body: rawBody,
            tldr: extractTldr(rawBody),
            images: extractAllImages(rawBody),
            excerpt: extractCleanExcerpt(rawBody),
            url: n.html_url || ("https://github.com/" + REPO + "/issues/" + n.number),
            labels: (n.labels || []).map(function(l){ return { name: l.name }; }),
            createdAt: n.created_at
          };
        })
        .sort(function(a,b){ return b.createdAt.localeCompare(a.createdAt); });

      loadingEl.classList.remove("show");
      errorEl.classList.remove("show");
      searchInput.disabled = false;
      renderSidebar();
      render();

      var hashMatch = location.hash.match(/^#issue-(\d+)$/);
      if (hashMatch) {
        var targetIdx = filteredNotes.findIndex(function(n){ return n.number === Number(hashMatch[1]); });
        if (targetIdx !== -1) openModalByIndex(targetIdx);
      }
    }

    sidebarNav.addEventListener("click", function(e){
      var btn = e.target.closest(".cat-btn");
      if (!btn) return;
      activeFilter = btn.getAttribute("data-filter") || "ALL";
      renderSidebar();
      render();
    });

    document.querySelector(".view-toggle").addEventListener("click", function(e){
      var btn = e.target.closest(".view-btn");
      if (!btn) return;
      document.querySelectorAll(".view-btn").forEach(function(b){ b.classList.remove("active"); });
      btn.classList.add("active");
      var view = btn.getAttribute("data-view");
      board.className = "notes-board " + (view === "grid" ? "grid-view" : "list-view");
    });

    board.addEventListener("click", function(e){
      var item = e.target.closest(".post-item");
      if (!item) return;
      openModalByIndex(Number(item.getAttribute("data-index")));
    });

    modalCloseBtn.addEventListener("click", closeModal);
    modal.addEventListener("click", function(e){ if (e.target === modal) closeModal(); });
    prevNoteBtn.addEventListener("click", function(){ if (currentModalIndex > 0) openModalByIndex(currentModalIndex - 1); });
    nextNoteBtn.addEventListener("click", function(){ if (currentModalIndex < filteredNotes.length - 1) openModalByIndex(currentModalIndex + 1); });

    copyLinkBtn.addEventListener("click", function(){
      navigator.clipboard.writeText(location.href).then(function(){
        copyLinkBtn.textContent = "✓ 복사됨";
        setTimeout(function(){ copyLinkBtn.textContent = "🔗 링크 복사"; }, 1500);
      });
    });

    modalBody.addEventListener("click", function(e){
      var img = e.target.closest("img");
      if (!img) return;
      lightboxImg.src = img.src;
      lightbox.classList.add("open");
    });
    lightbox.addEventListener("click", function(){ lightbox.classList.remove("open"); });

    searchInput.addEventListener("input", render);

    document.addEventListener("keydown", function(e){
      if (e.key === "Escape") {
        if (lightbox.classList.contains("open")) lightbox.classList.remove("open");
        else if (modal.classList.contains("open")) closeModal();
      }
      if (e.key === "/" && document.activeElement !== searchInput && !searchInput.disabled) {
        e.preventDefault();
        searchInput.focus();
      }
    });

    // GitHub API 호출 (실패 시 캐시 폴백 및 상세 에러 표시)
    fetch("https://api.github.com/repos/" + REPO + "/issues?state=all&per_page=100", {
      headers: { "Accept": "application/vnd.github+json" }
    })
      .then(function(res){
        if (!res.ok) throw new Error("HTTP " + res.status + (res.status === 403 ? " (GitHub API 호출 횟수 제한)" : ""));
        return res.json();
      })
      .then(function(data){
        try { sessionStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch(e){}
        applyData(data);
      })
      .catch(function(err){
        // API 제한 등에 걸렸을 때 세션 캐시가 있으면 캐시로 즉시 복구
        try {
          var cached = sessionStorage.getItem(CACHE_KEY);
          if (cached) {
            applyData(JSON.parse(cached));
            return;
          }
        } catch(e){}
        loadingEl.classList.remove("show");
        errorMsgEl.textContent = "포스트를 불러오지 못했습니다 (" + (err && err.message ? err.message : "네트워크 오류") + ").";
        errorEl.classList.add("show");
      });
  })();
  </script>
</body>
</html>
