<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archive | 이준석</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root{
    --ink:#0f172a;
    --ink-soft:#475569;
    --ink-faint:#94a3b8;
    --line:#e2e8f0;
    --line-strong:#cbd5e1;
    --navy:#173c78;
    --blue:#2563eb;
    --blue-soft:#eff4fd;
    --bg-page:#f8fafc;
    --bg-card:#ffffff;
    --font-main:"Pretendard","Gowun Dodum","Malgun Gothic",sans-serif;
    --font-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background-color:var(--bg-page);
    color:var(--ink);
    font-family:var(--font-main);
    -webkit-font-smoothing:antialiased;
  }
  body.modal-open{ overflow:hidden; }

  /* ── 상단 네비게이션 ── */
  .topbar{
    position:sticky; top:0; z-index:40;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(14px) saturate(140%);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    max-width:1280px;
    margin:0 auto;
    padding:18px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .topbar-brand{
    font-weight:800;
    text-decoration:none;
    font-size:1.18rem;
    letter-spacing:.02em;
    color:var(--navy);
  }
  .topbar-links{ display:flex; gap:26px; }
  .topbar-links a{
    position:relative;
    color:var(--ink-soft);
    text-decoration:none;
    font-size:.95rem;
    font-weight:600;
    padding-bottom:2px;
  }
  .topbar-links a::after{
    content:"";
    position:absolute; left:0; right:100%; bottom:-2px;
    height:1.5px;
    background:var(--navy);
    transition:right .22s cubic-bezier(.4,0,.2,1);
  }
  .topbar-links a:hover::after{ right:0; }
  .topbar-links a:hover{ color:var(--navy); }

  /* ── 메인 레이아웃 ── */
  main{
    max-width:1280px;
    margin:0 auto;
    padding:36px 24px 96px;
  }

  .blog-hero{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    padding-bottom:24px;
    margin-bottom:28px;
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .page-eyebrow{
    display:inline-block;
    font-size:.73rem;
    font-weight:700;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--navy);
    background:var(--blue-soft);
    padding:4px 10px;
    border-radius:6px;
    margin:0 0 8px;
  }
  .page-title{
    font-size:1.95rem;
    font-weight:800;
    letter-spacing:-.02em;
    margin:0 0 6px;
  }
  .page-lead{
    font-size:.93rem;
    line-height:1.6;
    color:var(--ink-soft);
    margin:0;
  }
  .btn-primary{
    font:inherit;
    font-size:.83rem;
    font-weight:700;
    color:#ffffff;
    background:var(--navy);
    border:1px solid var(--navy);
    border-radius:9px;
    padding:10px 16px;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:6px;
    transition:background .15s ease, transform .15s ease;
    white-space:nowrap;
  }
  .btn-primary:hover{
    background:#102a56;
    transform:translateY(-1px);
  }

  /* ── 2단 구조: 섹터 2(사이드바) + 섹터 3(피드) ── */
  .blog-layout{
    display:grid;
    grid-template-columns:230px 1fr;
    gap:32px;
    align-items:start;
  }

  /* 섹터 2: 사이드바 */
  .blog-sidebar{
    position:sticky;
    top:84px;
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 14px;
  }
  .sidebar-group{
    margin-bottom:18px;
    padding-bottom:16px;
    border-bottom:1px solid var(--line);
  }
  .sidebar-group:last-child{
    margin-bottom:0;
    padding-bottom:0;
    border-bottom:none;
  }
  .sidebar-heading{
    font-size:.71rem;
    font-weight:800;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-faint);
    padding:0 10px;
    margin:0 0 6px;
  }
  .sidebar-nav{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .cat-btn{
    width:100%;
    font:inherit;
    font-size:.85rem;
    font-weight:600;
    color:var(--ink-soft);
    background:transparent;
    border:none;
    border-radius:8px;
    padding:8px 10px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    text-align:left;
    transition:all .14s ease;
  }
  .cat-btn:hover{
    background:var(--bg-page);
    color:var(--navy);
  }
  .cat-btn.active{
    background:var(--blue-soft);
    color:var(--navy);
    font-weight:700;
  }
  .cat-count{
    font-family:var(--font-mono);
    font-size:.73rem;
    color:var(--ink-faint);
    background:var(--bg-page);
    padding:1px 7px;
    border-radius:999px;
  }
  .cat-btn.active .cat-count{
    background:#ffffff;
    color:var(--navy);
  }

  /* 섹터 3: 피드 툴바 & 보드 */
  .feed-toolbar{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .notes-search{
    flex:1;
    min-width:220px;
    position:relative;
  }
  .notes-search input{
    width:100%;
    padding:10px 36px 10px 36px;
    border:1px solid var(--line-strong);
    border-radius:10px;
    font:inherit;
    font-size:.88rem;
    color:var(--ink);
    background:var(--bg-card);
  }
  .notes-search input:focus{
    outline:none;
    border-color:var(--navy);
    box-shadow:0 0 0 3px rgba(23,60,120,.1);
  }
  .notes-search-icon{
    position:absolute; left:12px; top:50%;
    transform:translateY(-50%);
    color:var(--ink-faint);
    font-size:.88rem;
    pointer-events:none;
  }
  .notes-count{
    font-size:.84rem;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .notes-count b{ color:var(--navy); }

  .view-toggle{
    display:inline-flex;
    background:var(--bg-card);
    border:1px solid var(--line-strong);
    border-radius:8px;
    padding:2px;
  }
  .view-btn{
    font:inherit;
    font-size:.76rem;
    font-weight:600;
    color:var(--ink-soft);
    background:transparent;
    border:none;
    padding:5px 12px;
    border-radius:6px;
    cursor:pointer;
  }
  .view-btn.active{
    background:var(--navy);
    color:#ffffff;
  }

  /* 목록형 vs 카드형 */
  .notes-board.list-view{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .notes-board.grid-view{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    gap:18px;
  }

  .post-item{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-left:4px solid var(--navy);
    border-radius:12px;
    padding:20px 22px;
    cursor:pointer;
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    display:flex;
    flex-direction:column;
  }
  .post-item:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 24px -10px rgba(15,23,42,.1);
    border-color:var(--line-strong);
    border-left-color:var(--navy);
  }

  .post-meta{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    font-size:.75rem;
    color:var(--ink-faint);
    margin-bottom:8px;
  }
  .post-issue{
    font-family:var(--font-mono);
    font-weight:700;
    color:var(--navy);
    background:var(--blue-soft);
    padding:2px 7px;
    border-radius:4px;
  }
  .post-title{
    font-size:1.06rem;
    font-weight:800;
    color:var(--ink);
    margin:0 0 8px;
    line-height:1.42;
    word-break:keep-all;
  }
  .post-tldr{
    font-size:.82rem;
    font-weight:600;
    color:var(--navy);
    background:var(--blue-soft);
    padding:6px 10px;
    border-radius:6px;
    margin:0 0 8px;
    word-break:keep-all;
  }
  .post-excerpt{
    font-size:.86rem;
    line-height:1.62;
    color:var(--ink-soft);
    margin:0 0 14px;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    word-break:keep-all;
  }
  .post-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-top:auto;
    padding-top:10px;
    border-top:1px solid var(--line);
  }
  .post-tags{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .note-label-chip{
    font-size:.72rem;
    font-weight:600;
    color:var(--navy);
    background:var(--blue-soft);
    padding:2px 8px;
    border-radius:6px;
  }
  .post-more{
    font-size:.75rem;
    font-weight:700;
    color:var(--ink-soft);
    margin-left:auto;
  }
  .post-item:hover .post-more{ color:var(--navy); }

  /* 상태 표시 */
  .notes-state{
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:12px;
    padding:72px 24px;
    background:var(--bg-card);
    border:1px dashed var(--line-strong);
    border-radius:14px;
    color:var(--ink-soft);
    font-size:.92rem;
    text-align:center;
  }
  .notes-state.show{ display:flex; }
  .notes-spinner{
    width:24px; height:24px;
    border:2.5px solid var(--line);
    border-top-color:var(--navy);
    border-radius:50%;
    animation:notes-spin .8s linear infinite;
  }
  @keyframes notes-spin{ to{ transform:rotate(360deg); } }

  /* 아티클 모달 */
  .modal-backdrop{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(15,23,42,.55);
    backdrop-filter:blur(4px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .modal-backdrop.open{ display:flex; }
  .modal-dialog{
    background:var(--bg-card);
    width:100%;
    max-width:820px;
    max-height:90vh;
    border-radius:16px;
    border:1px solid var(--line);
    box-shadow:0 25px 50px -12px rgba(15,23,42,.28);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .modal-topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 24px;
    border-bottom:1px solid var(--line);
    background:var(--bg-page);
  }
  .modal-topbar-left{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:.8rem;
    color:var(--ink-soft);
  }
  .modal-actions{ display:flex; align-items:center; gap:8px; }
  .modal-btn{
    font:inherit;
    font-size:.78rem;
    font-weight:600;
    color:var(--ink-soft);
    background:var(--bg-card);
    border:1px solid var(--line-strong);
    border-radius:7px;
    padding:6px 11px;
    cursor:pointer;
    text-decoration:none;
  }
  .modal-btn:hover{ border-color:var(--navy); color:var(--navy); background:var(--blue-soft); }
  .modal-close{
    font:inherit; font-size:1.1rem; color:var(--ink-soft);
    background:transparent; border:none; width:32px; height:32px;
    border-radius:8px; cursor:pointer;
  }
  .modal-scroll{ padding:32px 36px 40px; overflow-y:auto; }
  .modal-title{
    font-size:1.55rem; font-weight:800; line-height:1.38;
    margin:0 0 14px; word-break:keep-all;
  }
  .modal-tags{
    display:flex; gap:6px; flex-wrap:wrap;
    margin-bottom:24px; padding-bottom:18px; border-bottom:1px solid var(--line);
  }

  /* 마크다운 본문 */
  .markdown-body{ font-size:.95rem; line-height:1.8; color:#1e293b; word-break:keep-all; overflow-wrap:anywhere; }
  .markdown-body
