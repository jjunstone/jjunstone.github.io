<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT Team Simulator | 이준석</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<style>
  :root{
    --ink:#141414;
    --ink-soft:#5b5b5b;
    --ink-faint:#8a8a8a;
    --line:#e6e6e6;
    --accent:#173c78;
    --bg:#f8fafc;
    --font-main:"Pretendard","Gowun Dodum","Malgun Gothic",sans-serif;
    --header-h:56px;
    --subbar-h:48px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-main);
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }

  /* ── 통합 헤더: 로고+네비 / 시뮬레이터 컨트롤을 한 줄에 ── */
  .site-topbar{
    display:flex; align-items:center; justify-content:center; position:relative; gap:16px;
    height:var(--header-h); padding:0 20px; border-bottom:1px solid var(--line);
    background:#ffffff; flex-shrink:0; z-index:30;
  }
  .site-topbar-brand-group{
    display:flex; align-items:center; gap:10px; min-width:0;
    position:absolute; left:20px;
  }
  .site-topbar-brand{ font-weight:700; text-decoration:none; color:var(--ink); font-size:15px; flex-shrink:0; }
  .site-topbar-brand-divider{ color:var(--ink-faint); font-weight:400; flex-shrink:0; }
  .site-topbar-title{ font-size:13px; font-weight:800; letter-spacing:.02em; color:var(--ink); flex-shrink:0; white-space:nowrap; }
  .site-topbar-nav{ display:flex; align-items:center; gap:18px; flex-shrink:0; }
  .site-topbar-nav a{ font-size:12.5px; font-weight:600; color:var(--ink); text-decoration:none; }
  .site-topbar-case{
    font-size:12.5px; color:var(--ink-soft); font-weight:600; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; min-width:0; max-width:220px;
  }
  .site-topbar-right{
    display:flex; align-items:center; gap:10px; flex-shrink:0;
    position:absolute; right:20px;
  }
  .sim-clock{ font-size:.8rem; color:var(--ink-soft); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .sim-btn-ghost{
    font-size:.78rem; color:var(--ink-soft); text-decoration:none; background:none;
    border:1px solid var(--line); border-radius:999px; padding:6px 13px; cursor:pointer; font-family:inherit;
    white-space:nowrap;
  }
  .sim-btn-ghost:hover{ border-color:var(--accent); color:var(--accent); }

  /* ── 본문 3단 레이아웃 (고정 그리드, 레이아웃이 흔들리지 않음) ── */
  #app{ flex:1; min-height:0; display:flex; flex-direction:column; }
  .sim-body{
    display:grid;
    grid-template-columns:260px minmax(0, 1fr) 360px;
    gap:1px;
    background:var(--line);
    flex:1;
    min-height:0;
    overflow:hidden;
  }

  /* ── 좌측: 사건 목록 ── */
  .sim-cases{ background:#ffffff; overflow-y:auto; padding:16px; min-width:0; min-height:0; }
  .sim-cases-title{ font-size:.72rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:12px; }
  .case-card{
    display:block; width:100%; text-align:left; background:none; border:1px solid var(--line);
    border-radius:10px; padding:12px; margin-bottom:10px; cursor:pointer; font-family:inherit;
    transition:border-color .15s ease, background .15s ease;
  }
  .case-card:hover{ border-color:var(--accent); }
  .case-card-open{ border-color:var(--accent); background:#f7f8fb; }
  .case-card-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .case-cat{ font-size:.68rem; color:var(--ink-faint); }
  .case-diff{ font-size:.68rem; font-weight:700; padding:2px 7px; border-radius:999px; }
  .case-diff-하{ background:#ecfdf3; color:#067647; }
  .case-diff-중{ background:#fffaeb; color:#b54708; }
  .case-diff-상{ background:#fef3f2; color:#b42318; }
  .case-title{ font-size:.92rem; font-weight:700; margin-bottom:4px; }
  .case-meta{ font-size:.74rem; color:var(--ink-faint); margin-bottom:6px; }
  .case-challenge{ font-size:.78rem; color:var(--ink-soft); line-height:1.5; }
  .case-assumption{ font-size:.68rem; color:#b54708; margin-top:6px; }

  /* ── 중앙: 사무실 평면도 (독립 스크롤 영역) ── */
  .sim-org{
    background:#ffffff; overflow-y:auto; padding:16px; display:flex; flex-direction:column;
    min-height:0; min-width:0;
  }
  .sim-org-title{ font-size:.72rem; font-weight:700; letter-spacing:.04em; color:var(--ink-faint); margin-bottom:10px; flex-shrink:0; }

  .svc-board{ flex-shrink:0; margin-bottom:12px; }
  .svc-board-label{ font-size:.64rem; color:var(--ink-faint); margin-bottom:6px; }
  .svc-board-chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .svc-chip{
    display:inline-flex; align-items:center; gap:5px;
    font-size:.64rem; color:var(--ink-soft);
    background:#f3f4f1; border:1px solid var(--line); border-radius:999px;
    padding:3px 9px 3px 7px; white-space:nowrap;
  }
  .svc-dot{ width:6px; height:6px; border-radius:50%; background:#2e9e5b; flex-shrink:0; }
  .svc-chip.svc-affected{ background:#fdecea; border-color:#f1b3ac; color:#8c2a1e; }
  .svc-chip.svc-affected .svc-dot{ background:#d62d20; }

  .org-floor{
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:auto auto auto auto auto;
    grid-template-areas:
      "ciso ciso"
      "warroom warroom"
      "dba sec"
      "net infra"
      "server server";
    gap:10px;
    width:100%;
    flex-shrink:0;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.04) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.04) 0 1px, transparent 1px 28px),
      #eef0e8;
    border:3px solid #2b2b2b;
    border-radius:6px;
    padding:12px;
  }
  .org-floor.no-session{
    grid-template-rows:auto 1fr 1fr 1fr;
    grid-template-areas:
      "ciso ciso"
      "dba sec"
      "net infra"
      "server server";
  }

  .org-zone{
    border:2px dashed #95a186;
    border-radius:8px;
    background:rgba(255,255,255,.75);
    padding:10px;
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .org-zone[data-zone="총괄"]{
    grid-area:ciso;
    background:rgba(240,240,240,.9);
    border-color:#8a8a8a;
    border-style:solid;
  }
  .org-zone[data-zone="DBA팀"]{ grid-area:dba; }
  .org-zone[data-zone="보안팀"]{ grid-area:sec; }
  .org-zone[data-zone="네트워크팀"]{ grid-area:net; }
  .org-zone[data-zone="인프라/DevOps팀"]{ grid-area:infra; }
  .org-zone[data-zone="서버팀"]{ grid-area:server; }
  .org-zone-warroom{
    grid-area:warroom;
    background:rgba(255,247,236,.9);
    border-color:#c99a4a;
    border-style:solid;
  }
  .org-zone-label{
    font-size:.68rem;
    font-weight:700;
    letter-spacing:.04em;
    color:#4a5240;
    text-transform:uppercase;
    margin-bottom:8px;
    flex-shrink:0;
  }
  .org-zone-warroom .org-zone-label{ color:#9a5b12; }
  .org-zone-people{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(84px, 1fr));
    gap:10px;
    flex:1;
    align-content:center;
  }
  .org-zone-warroom .org-zone-people{
    grid-template-columns:repeat(auto-fit, minmax(96px, 1fr));
    align-content:center;
  }

  .org-node{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:10px 6px 8px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fafafa;
    box-shadow:0 1px 0 rgba(0,0,0,.04), inset 0 2px 0 rgba(0,0,0,.03);
    cursor:pointer;
    text-align:center;
    transition:border-color .15s ease, background .15s ease;
  }
  .org-node::before{
    content:"";
    display:block;
    width:60%;
    height:4px;
    border-radius:2px;
    background:var(--role-color);
    opacity:.55;
    margin-bottom:2px;
  }
  .org-node:hover{ border-color:var(--accent); background:#f1f4fb; }
  .org-node:focus-visible{ box-shadow:0 0 0 2px var(--accent); }
  .org-node.mode-idle{ opacity:.55; }

  .org-node.mode-speaking, .org-node.mode-speaking-player{ border-color:#173c78; background:#eaf0fb; }
  .org-node.mode-listening{ border-color:#b42318; background:#fdecea; }
  .org-node.mode-player{ border-color:#0f6656; background:#e8f7f1; }

  .org-avatar{
    width:32px; height:32px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:.78rem; font-weight:700; color:#ffffff;
    background:var(--role-color);
    flex-shrink:0;
  }

  .org-node > div{ display:flex; flex-direction:column; align-items:center; }
  .org-name{ font-size:.74rem; font-weight:700; color:#2b2b2b; white-space:nowrap; }
  .org-status{ font-size:.62rem; font-weight:700; color:var(--role-color); white-space:nowrap; }
  .org-status-idle{ color:#8a8a8a; font-weight:400; }

  /* ── 담당자 상세 모달 (조직도 위에 겹치지 않고 화면 전체 오버레이) ── */
  .person-modal-overlay{
    position:fixed; inset:0; z-index:200; background:rgba(15,23,42,.45);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .person-modal{
    width:100%; max-width:360px; max-height:80vh; overflow-y:auto;
    background:#ffffff; border:1px solid var(--line); border-radius:16px;
    padding:22px; box-shadow:0 24px 60px rgba(20,20,20,.22); position:relative;
  }
  .person-modal-close{
    position:absolute; top:14px; right:14px; width:26px; height:26px; border-radius:50%;
    border:none; background:#f1f1f1; color:var(--ink-soft); font-size:1rem; line-height:1; cursor:pointer;
  }
  .person-modal-head{ display:flex; align-items:center; gap:12px; margin-bottom:14px; padding-right:28px; }
  .person-modal-avatar{ width:44px; height:44px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .person-modal-avatar .org-avatar{ width:44px; height:44px; font-size:1rem; }
  .person-modal-name{ font-size:1rem; font-weight:700; }
  .person-modal-dept{ font-size:.76rem; color:var(--ink-faint); }
  .person-modal-authority{ font-size:.8rem; color:var(--ink-soft); margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid var(--line); }
  .person-modal-label{ font-size:.68rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:8px; }
  .person-modal-list{ list-style:none; margin:0 0 14px; padding:0; display:flex; flex-direction:column; gap:6px; }
  .person-modal-list li{ font-size:.82rem; color:var(--ink-soft); padding-left:13px; position:relative; line-height:1.5; }
  .person-modal-list li::before{ content:"·"; position:absolute; left:1px; color:var(--ink-faint); }
  .person-modal-tag{ display:inline-block; font-size:.72rem; font-weight:700; padding:4px 10px; border-radius:999px; background:#ecfdf3; color:#067647; }
  .person-modal-tag-idle{ background:#f1f1f1; color:var(--ink-faint); }

  /* ── 우측: 상황 패널 (컨트롤 영역 고정, 가변 콘텐츠만 스크롤) ── */
  .sim-right-col{
    display:flex; flex-direction:column; min-height:0; min-width:0; background:#ffffff; overflow:hidden;
  }
  .sim-panel{ overflow-y:auto; padding:20px; flex:1; min-height:0; }
  .sim-panel-empty{ display:flex; flex-direction:column; justify-content:flex-start; color:var(--ink-soft); font-size:.85rem; text-align:left; }
  .sim-intro-eyebrow{ font-size:.68rem; font-weight:700; letter-spacing:.04em; color:var(--accent); margin-bottom:6px; }
  .sim-intro-title{ font-size:1.05rem; font-weight:700; color:var(--ink); margin:0 0 12px; line-height:1.4; }
  .sim-intro-lead{ font-size:.86rem; line-height:1.7; color:var(--ink-soft); margin:0 0 16px; }
  .sim-intro-block{ margin:0 0 16px; padding:14px 16px; background:#f7f8fb; border:1px solid var(--line); border-radius:10px; }
  .sim-intro-block-title{ font-size:.72rem; font-weight:700; letter-spacing:.03em; color:var(--ink); margin:0 0 8px; text-transform:uppercase; }
  .sim-intro-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .sim-intro-list li{ font-size:.78rem; color:var(--ink-soft); line-height:1.55; padding-left:14px; position:relative; }
  .sim-intro-list li::before{ content:"·"; position:absolute; left:2px; color:var(--ink-faint); }
  .sim-intro-note{ font-size:.74rem; color:var(--ink-faint); line-height:1.6; margin:4px 0 0; padding-top:12px; border-top:1px solid var(--line); }
  .sim-intro-cta{ font-size:.82rem; color:var(--accent); font-weight:600; margin:14px 0 0; }
  .sim-panel-eyebrow{ font-size:.68rem; font-weight:700; letter-spacing:.04em; color:var(--accent); }
  .sim-panel-title{ font-size:1.1rem; font-weight:700; margin:6px 0 10px; }
  .sim-panel-brief{ font-size:.82rem; color:var(--ink-soft); line-height:1.6; margin:0 0 18px; padding-bottom:16px; border-bottom:1px solid var(--line); }
  .sim-narration{ font-size:.88rem; line-height:1.65; margin-bottom:14px; }
  .sim-facts{ list-style:none; margin:0 0 18px; padding:0; display:flex; flex-direction:column; gap:6px; }
  .sim-facts li{ font-size:.78rem; color:var(--ink-soft); padding-left:14px; position:relative; }
  .sim-facts li::before{ content:"·"; position:absolute; left:2px; color:var(--ink-faint); }
  .sim-choices{ display:flex; flex-direction:column; gap:8px; margin-bottom:22px; }
  .sim-choice-card{
    display:flex; justify-content:space-between; align-items:center; width:100%; text-align:left;
    background:none; border:1px solid var(--line); border-radius:10px; padding:12px 14px; cursor:pointer; font-family:inherit;
  }
  .sim-choice-card:hover{ border-color:var(--accent); background:#f7f8fb; }
  .sim-choice-label{ font-size:.84rem; font-weight:600; }
  .sim-choice-arrow{ font-size:.74rem; color:var(--ink-faint); flex-shrink:0; }
  .sim-result{ padding-top:4px; }
  .sim-result-badge{ display:inline-block; font-size:.72rem; font-weight:700; padding:4px 10px; border-radius:999px; margin-bottom:10px; }
  .result-resolved .sim-result-badge{ background:#ecfdf3; color:#067647; }
  .result-partial .sim-result-badge{ background:#fffaeb; color:#b54708; }
  .sim-result-summary{ font-size:.86rem; line-height:1.65; margin:0 0 16px; }
  .sim-lessons-title{ font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:8px; }
  .sim-lessons{ list-style:none; margin:0 0 20px; padding:0; display:flex; flex-direction:column; gap:6px; }
  .sim-lessons li{ font-size:.8rem; color:var(--ink-soft); line-height:1.5; padding-left:14px; position:relative; }
  .sim-lessons li::before{ content:"✓"; position:absolute; left:0; color:var(--accent); font-size:.7rem; }
  .sim-btn-primary{
    background:var(--ink); color:#fff; border:none; border-radius:10px; padding:10px 18px;
    font-size:.84rem; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .sim-btn-primary:hover{ background:var(--accent); }

  /* ── 보고 스레드: 접기/펼치기 가능한 섹션 (레이아웃을 흔들지 않음) ── */
  .sim-thread-wrap{ border-top:1px solid var(--line); flex-shrink:0; max-height:40%; display:flex; flex-direction:column; }
  .sim-thread-wrap.is-empty{ display:none; }
  .sim-thread-toggle{
    display:flex; align-items:center; justify-content:space-between; width:100%;
    background:#fafbfc; border:none; padding:10px 20px; cursor:pointer; font-family:inherit;
    font-size:.72rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint);
    flex-shrink:0;
  }
  .sim-thread-toggle:hover{ color:var(--ink-soft); }
  .sim-thread-toggle-arrow{ transition:transform .15s ease; }
  .sim-thread-wrap.is-collapsed .sim-thread-toggle-arrow{ transform:rotate(-90deg); }
  .sim-thread{ overflow-y:auto; padding:4px 18px 16px; min-height:0; }
  .sim-thread-wrap.is-collapsed .sim-thread{ display:none; }
  .thread-list{ display:flex; flex-direction:column; gap:10px; }
  .thread-msg{ display:flex; gap:10px; align-items:flex-start; }
  .thread-msg-avatar{
    width:24px; height:24px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    margin-top:2px;
  }
  .thread-msg-avatar .org-avatar{ width:24px; height:24px; font-size:.64rem; }
  .thread-msg-body{
    flex:1; min-width:0; background:#f7f8fb; border:1px solid var(--line); border-radius:8px;
    padding:9px 12px;
  }
  .thread-msg-action .thread-msg-body{ background:#eef3fb; border-color:#c6d4ec; }
  .thread-msg-terminal .thread-msg-body{ background:#eefbf4; border-color:#a9e0c4; }
  .thread-msg-head{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:4px; }
  .thread-msg-route{ font-size:.72rem; font-weight:700; color:var(--accent); }
  .thread-msg-time{ font-size:.68rem; color:var(--ink-faint); font-variant-numeric:tabular-nums; flex-shrink:0; }
  .thread-msg-text{ font-size:.78rem; line-height:1.55; color:var(--ink-soft); margin:0; }

  /* ── 하단: 타임라인 (접기/펼치기 가능) ── */
  .sim-timeline-wrap{ border-top:1px solid var(--line); background:#ffffff; flex-shrink:0; }
  .sim-timeline-wrap.is-empty{ display:none; }
  .sim-timeline-toggle{
    display:flex; align-items:center; justify-content:space-between; width:100%;
    background:none; border:none; padding:10px 20px; cursor:pointer; font-family:inherit;
    font-size:.68rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint);
  }
  .sim-timeline-toggle:hover{ color:var(--ink-soft); }
  .sim-timeline-toggle-arrow{ transition:transform .15s ease; }
  .sim-timeline-wrap.is-collapsed .sim-timeline-toggle-arrow{ transform:rotate(180deg); }
  .sim-timeline{ padding:0 20px 14px; max-height:140px; overflow-y:auto; }
  .sim-timeline-wrap.is-collapsed .sim-timeline{ display:none; }
  .tl-list{ display:flex; flex-direction:column; gap:6px; }
  .tl-item{ display:flex; gap:10px; align-items:baseline; font-size:.78rem; }
  .tl-time{ font-variant-numeric:tabular-nums; color:var(--ink-faint); flex-shrink:0; width:52px; }
  .tl-label{ font-weight:600; flex-shrink:0; }
  .tl-detail{ color:var(--ink-soft); }

  @media (max-width:1180px){
    .sim-body{ grid-template-columns:230px minmax(0, 1fr) 320px; }
  }

  @media (max-width:980px){
    body{ height:auto; overflow:auto; }
    #app{ overflow:visible; }
    .sim-body{ grid-template-columns:1fr; overflow:visible; }
    .sim-cases{ max-height:280px; }
    .sim-thread-wrap{ max-height:none; }
    .sim-timeline{ max-height:none; }
    .org-floor{
      grid-template-columns:1fr;
      grid-template-areas:"ciso" "warroom" "dba" "sec" "net" "infra" "server";
    }
    .org-floor.no-session{
      grid-template-areas:"ciso" "dba" "sec" "net" "infra" "server";
    }
    .site-topbar{ flex-wrap:wrap; height:auto; padding:10px 16px; gap:8px; }
    .site-topbar-brand-group{ position:static; flex-wrap:wrap; }
    .site-topbar-right{ position:static; }
    .site-topbar-case{ max-width:none; }
  }

  @media (prefers-reduced-motion: reduce){
    .org-node{ transition:none; }
  }
</style>
</head>
<body>
  <main id="app"></main>

  <script src="./it-team-sim/data/sim-data.js"></script>
  <script src="./it-team-sim/domain/sim-domain.js"></script>
  <script src="./it-team-sim/ui/sim-ui.js"></script>
</body>
</html>
