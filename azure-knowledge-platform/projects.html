<!DOCTYPE html>
<html lang="ko" style="background:#0f172a">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>Projects — Junseok Lee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "xpfijrd574");
  </script>
  <style>
    :root {
      --topbar-h: 92px;
      --sidebar-w: 240px;
      /* Light mode */
      --bg-light: #f8fafc;
      --bg-panel-light: #ffffff;
      --border-light: #e2e8f0;
      --text-light-mode: #0f172a;
      --text-muted-light: #64748b;
      --text-light-muted: #94a3b8;
      /* Dark mode */
      --bg-dark: #0f172a;
      --bg-panel-dark: #1e293b;
      --border-dark: rgba(255,255,255,.1);
      --text-dark-mode: #f1f5f9;
      --text-muted-dark: #94a3b8;
      --text-light-dark: #64748b;
      /* Common */
      --accent: #3b82f6;
      --accent-light: #eff6ff;
      --gold: #d4af6a;

      /* Default to dark */
      --bg: var(--bg-dark);
      --bg-panel: var(--bg-panel-dark);
      --border: var(--border-dark);
      --text: var(--text-dark-mode);
      --text-muted: var(--text-muted-dark);
      --text-light: var(--text-light-dark);
    }

    html.light-mode {
      --bg: var(--bg-light);
      --bg-panel: var(--bg-panel-light);
      --border: var(--border-light);
      --text: var(--text-light-mode);
      --text-muted: var(--text-muted-light);
      --text-light: var(--text-light-muted);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; min-height: 100%;
      font-family: "Pretendard", "Inter", system-ui, sans-serif;
      color: var(--text); background: var(--bg);
    }

    /* ── Topbar ── */
    .topbar {
      /* 항상 화이트 배경 — 아래 문서 영역(항상 라이트)과 이어지도록 다크모드와 무관하게 고정 */
      --bg-panel: #ffffff;
      --border: var(--doc-border);
      --bg: var(--doc-bg);
      --text: var(--doc-text);
      --text-muted: var(--doc-text-muted);
      --text-light: var(--doc-gray);
      position: fixed; top: 0; left: 0; right: 0; height: var(--topbar-h);
      background: var(--bg-panel); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; z-index: 100; padding: 0 32px;
      transition: background-color .3s, border-color .3s;
    }
    .topbar-brand {
      display: flex; align-items: center; gap: 10px; flex: 1 1 0; min-width: 0;
      text-decoration: none;
    }
    .logo-icon {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      display: grid; place-items: center; font-size: 16px; color: white;
      box-shadow: 0 2px 10px rgba(59,130,246,.4);
    }
    .brand-info { line-height: 1.2; }
    .brand-name { font-size: 15px; font-weight: 700; color: var(--text); transition: color .3s; }
    .brand-role { font-size: 11px; color: var(--text-light); transition: color .3s; }

    .topbar-nav { display: flex; align-items: center; justify-content: center; gap: 10px; flex: 0 0 auto; }
    .tnav {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 15px; border-radius: 10px; min-width: 190px;
      color: var(--text-light); cursor: pointer; transition: .15s ease;
      text-decoration: none; border: 1px solid var(--border); background: transparent;
      font-family: inherit;
    }
    .tnav:hover { border-color: var(--text-light); background: var(--bg); }
    .tnav.active { border-color: var(--accent); background: rgba(59,130,246,.14); }
    .tnav.active .tnav-title { color: var(--accent); }
    .tnav-icon { font-size: 20px; line-height: 1; flex-shrink: 0; width: 22px; text-align: center; }
    .tnav-body { display: flex; flex-direction: column; gap: 2px; line-height: 1.3; min-width: 0; }
    .tnav-title { font-size: 14px; font-weight: 700; color: var(--text); }
    .tnav-desc { font-size: 11.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar-right { display: flex; align-items: center; justify-content: flex-end; gap: 12px; flex: 1 1 0; min-width: 0; }
    .theme-toggle {
      width: 36px; height: 36px; border-radius: 7px; border: 1px solid var(--border);
      background: transparent; display: grid; place-items: center; cursor: pointer;
      color: var(--text-light); transition: .2s; font-family: inherit;
    }
    .theme-toggle:hover { 
      color: var(--text); border-color: var(--accent);
    }
    .theme-toggle svg { width: 18px; height: 18px; }

    /* ── Page body ── */
    .body-wrap {
      padding-top: var(--topbar-h);
      min-height: 100vh;
      display: flex; flex-direction: column;
    }

    /* ══════════════════════════════════════════════════════════
       Project Documentation Notebook
       (관리문서 열람 시스템 — 화이트/페이퍼 톤을 항상 유지,
        사이트 다크모드와 무관하게 "문서"라는 정체성을 고정합니다)
       ══════════════════════════════════════════════════════════ */
    :root {
      --doc-bg: #f5f6f8;
      --doc-paper: #ffffff;
      --doc-text: #172033;
      --doc-text-muted: #667085;
      --doc-border: #e4e7ec;
      --doc-accent: #3b82f6;
      --doc-accent-soft: rgba(59,130,246,.1);
      --doc-green: #16a34a;
      --doc-amber: #d97706;
      --doc-gray: #94a3b8;
    }

    .docnb-layout { flex: 1; display: flex; min-height: 0; background: var(--doc-bg); }

    /* ── Project nav sidebar ── */
    .docnb-sidebar {
      width: 300px; flex-shrink: 0; border-right: 1px solid var(--doc-border);
      background: var(--doc-paper); display: flex; flex-direction: column; min-height: 0;
    }
    .docnb-sidebar-head { padding: 18px 18px 14px; border-bottom: 1px solid var(--doc-border); }
    .docnb-sidebar-title {
      font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--doc-text-muted);
    }

    .docnb-project-list { flex: 1; overflow-y: auto; padding: 10px 12px 20px; }
    .docnb-domain-group { margin-bottom: 4px; }
    .docnb-domain-label {
      font-size: 10.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
      color: var(--doc-gray); padding: 12px 8px 6px;
    }
    .docnb-project-item {
      display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 10px;
      cursor: pointer; margin-bottom: 2px; border: 1px solid transparent; transition: .12s ease;
    }
    .docnb-project-item:hover { background: var(--doc-bg); }
    .docnb-project-item.active { background: var(--doc-accent-soft); border-color: rgba(59,130,246,.25); }
    .docnb-project-item-top { display: flex; align-items: center; gap: 8px; }
    .docnb-project-num { font-size: 11px; font-weight: 800; color: var(--doc-gray); flex-shrink: 0; font-variant-numeric: tabular-nums; width: 20px; }
    .docnb-project-item.active .docnb-project-num { color: var(--doc-accent); }
    .docnb-project-title {
      font-size: 13px; font-weight: 600; color: var(--doc-text); line-height: 1.4;
    }
    .docnb-project-item.active .docnb-project-title { color: var(--doc-accent); }

    /* ── Main documentation area ── */
    .docnb-main { flex: 1; min-width: 0; overflow-y: auto; }

    .docnb-doclist-wrap { padding: 8px 44px 48px; }
    .docnb-doclist-wrap-top { padding-top: 36px; }
    .docnb-doclist-title { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--doc-text-muted); text-transform: uppercase; margin: 22px 0 14px; }
    .docnb-doc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; }
    .docnb-doc-card {
      background: var(--doc-paper); border: 1px solid var(--doc-border); border-radius: 4px;
      cursor: pointer; transition: .15s ease; display: flex; flex-direction: column;
      min-height: 300px; padding: 22px 22px 16px;
    }
    .docnb-doc-card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(15,23,42,.1); border-color: rgba(59,130,246,.35); }

    /* 정식 표지형 카드 리스트 — eyebrow/문서번호 + 상단 룰 + 중앙 정렬 제목/부제 + 우측 메타 + 하단 섹터 푸터 */
    .docnb-doc-card-top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
    .docnb-doc-card-eyebrow2 { font-size: 9.5px; font-weight: 800; letter-spacing: .12em; color: var(--doc-accent); }
    .docnb-doc-card-no { font-size: 10px; font-weight: 700; color: var(--doc-gray); font-variant-numeric: tabular-nums; }
    .docnb-doc-card-rule { height: 2px; background: var(--doc-accent); width: 30px; flex-shrink: 0; }
    .docnb-doc-card-spacer-top { flex: 3 0 0; }
    .docnb-doc-card-spacer-bottom { flex: 7 0 0; }
    .docnb-doc-card-titleblock { text-align: center; flex-shrink: 0; }
    .docnb-doc-card-title-line { height: 1px; background: var(--doc-border); width: 70%; margin: 0 auto; flex-shrink: 0; }
    .docnb-doc-card-title2 {
      font-size: 17px; font-weight: 800; color: var(--doc-text); line-height: 1.45; padding: 12px 6px;
      word-break: keep-all; overflow-wrap: break-word;
    }
    .docnb-doc-card-subtitle2 { font-size: 12px; color: var(--doc-text-muted); margin-top: 9px; word-break: keep-all; }
    .docnb-doc-card-metabox2 { text-align: right; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
    .docnb-doc-card-metarow2 { font-size: 10.5px; color: var(--doc-text-muted); }
    .docnb-doc-card-metarow2 .mark { color: var(--doc-accent); margin-right: 5px; }
    .docnb-doc-card-footer2 { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--doc-border); text-align: center; font-size: 10.5px; font-weight: 800; letter-spacing: .1em; color: var(--doc-accent); }

    /* ── Note-style document modal (정식 보고서 느낌 + 3D 페이지 플립) ── */
    .doc-modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 250;
      background: rgba(15,23,42,.55); backdrop-filter: blur(3px);
      align-items: center; justify-content: center; padding: 26px;
    }
    .doc-modal-overlay.show { display: flex; }
    .doc-modal-panel {
      position: relative; width: min(820px, 100%); height: min(86vh, 900px);
      background: var(--doc-paper); border-radius: 16px; box-shadow: 0 30px 70px rgba(15,23,42,.4);
      display: flex; flex-direction: column; overflow: hidden;
      color: var(--doc-text);
    }
    .doc-modal-head {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 16px 22px; border-bottom: 1px solid var(--doc-border); flex-shrink: 0; position: relative; z-index: 2;
    }
    .doc-modal-head-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .doc-modal-docnum { font-size: 11.5px; font-weight: 700; color: var(--doc-gray); letter-spacing: .03em; flex-shrink: 0; }
    .doc-modal-projtitle { font-size: 13px; font-weight: 700; color: var(--doc-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .doc-modal-head-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .doc-modal-pageind { font-size: 12px; color: var(--doc-text-muted); font-variant-numeric: tabular-nums; }
    .doc-modal-icon-btn {
      width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--doc-border);
      background: var(--doc-bg); color: var(--doc-text-muted); cursor: pointer; font-size: 13px;
      display: grid; place-items: center; transition: .15s;
    }
    .doc-modal-icon-btn:hover { color: var(--doc-text); border-color: var(--doc-accent); }

    .doc-modal-toc {
      display: none; position: absolute; top: 58px; right: 22px; width: 300px; max-height: 60vh; overflow-y: auto;
      background: var(--doc-paper); border: 1px solid var(--doc-border); border-radius: 12px;
      box-shadow: 0 16px 40px rgba(15,23,42,.18); z-index: 5; padding: 8px;
    }
    .doc-modal-toc.show { display: block; }
    .doc-modal-toc-item {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 12.5px;
    }
    .doc-modal-toc-item:hover { background: var(--doc-bg); }
    .doc-modal-toc-item.current { background: var(--doc-accent-soft); color: var(--doc-accent); font-weight: 700; }
    .doc-modal-toc-num { color: var(--doc-gray); font-weight: 700; width: 20px; flex-shrink: 0; }
    .doc-modal-toc-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--doc-accent); margin-left: auto; flex-shrink: 0; }

    .doc-modal-progress { display: flex; gap: 3px; padding: 0 22px; flex-shrink: 0; position: relative; z-index: 2; }
    .doc-modal-progress-seg { flex: 1; height: 3px; border-radius: 2px; background: var(--doc-border); cursor: pointer; }
    .doc-modal-progress-seg.done { background: rgba(59,130,246,.35); }
    .doc-modal-progress-seg.current { background: var(--doc-accent); }

    /* 페이지 플립 무대 — 3D 회전을 위한 원근 컨테이너 */
    .doc-modal-flip-stage { flex: 1; min-height: 0; perspective: 1600px; }
    .doc-modal-body { height: 100%; overflow-y: auto; padding: 28px 44px 40px; }
    .doc-modal-body-inner { max-width: 620px; margin: 0 auto; transform-origin: left center; backface-visibility: hidden; }
    .doc-page-flip-next { animation: pageFlipNext .48s cubic-bezier(.4,0,.2,1); transform-origin: left center; }
    .doc-page-flip-prev { animation: pageFlipPrev .48s cubic-bezier(.4,0,.2,1); transform-origin: right center; }
    @keyframes pageFlipNext {
      0%   { transform: rotateY(-95deg) translateZ(0); opacity: 0; }
      60%  { opacity: 1; }
      100% { transform: rotateY(0deg); opacity: 1; }
    }
    @keyframes pageFlipPrev {
      0%   { transform: rotateY(95deg) translateZ(0); opacity: 0; }
      60%  { opacity: 1; }
      100% { transform: rotateY(0deg); opacity: 1; }
    }
    .doc-page-eyebrow { font-size: 11px; font-weight: 700; color: var(--doc-accent); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }
    .doc-page-title { font-size: 21px; font-weight: 800; color: var(--doc-text); margin-bottom: 4px; line-height: 1.35; }
    .doc-page-subtitle { font-size: 12px; color: var(--doc-gray); font-weight: 600; margin-bottom: 22px; }

    /* ── 표지 페이지 (모든 프로젝트 공통 템플릿) ── */
    .doc-modal-body-inner:has(.doc-cover-page) { max-width: none; margin: 0; }
    .doc-cover-page { position: relative; display: grid; grid-template-columns: 1fr 190px; gap: 30px; min-height: 520px; }
    .doc-cover-main { position: relative; padding-top: 6px; }
    .doc-cover-badge { position: absolute; top: 0; right: 0; text-align: right; }
    .doc-cover-badge .lbl { font-size: 9px; font-weight: 800; letter-spacing: .12em; color: var(--doc-gray); }
    .doc-cover-badge .num { font-size: 15px; font-weight: 800; color: var(--doc-text); margin-top: 2px; }
    .doc-cover-badge .rule { width: 26px; height: 2px; background: var(--doc-accent); margin: 6px 0 0 auto; }
    .doc-cover-eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .16em; color: var(--doc-accent); margin: 30px 0 12px; }
    .doc-cover-title { font-size: 25px; font-weight: 900; color: var(--doc-text); line-height: 1.32; margin-bottom: 16px; max-width: 88%; }
    .doc-cover-divider { width: 42px; height: 3px; border-radius: 2px; background: var(--doc-accent); margin-bottom: 14px; }
    .doc-cover-subtitle { font-size: 12.5px; color: var(--doc-text-muted); margin-bottom: 26px; }
    .doc-cover-meta-list { display: flex; flex-direction: column; margin-bottom: 8px; }
    .doc-cover-meta-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--doc-border); font-size: 12.5px; }
    .doc-cover-meta-row:last-child { border-bottom: none; }
    .dcm-icon { width: 16px; height: 16px; color: var(--doc-accent); flex-shrink: 0; }
    .dcm-icon svg { width: 100%; height: 100%; }
    .dcm-label { font-weight: 700; color: var(--doc-text); width: 62px; flex-shrink: 0; }
    .dcm-sep { color: var(--doc-border); }
    .dcm-value { color: var(--doc-text-muted); }
    .doc-cover-section-title {
      font-size: 12.5px; font-weight: 800; color: var(--doc-text); letter-spacing: .02em;
      margin: 22px 0 10px; padding-top: 16px; border-top: 1px solid var(--doc-border);
    }
    .doc-cover-toc { list-style: none; display: flex; flex-direction: column; gap: 1px; margin: 0 0 4px; padding: 0; }
    .doc-cover-toc-item {
      display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 7px; cursor: pointer;
      font-size: 12.5px; color: var(--doc-text-muted); transition: .12s;
    }
    .doc-cover-toc-item:hover { background: var(--doc-bg); color: var(--doc-text); }
    .doc-cover-toc-item .n { font-weight: 800; color: var(--doc-gray); width: 20px; flex-shrink: 0; }
    .doc-cover-summary { font-size: 12.5px; color: var(--doc-text-muted); line-height: 1.85; }
    .doc-cover-side {
      position: relative; overflow: hidden; border-radius: 14px; min-height: 100%;
      background: linear-gradient(160deg, #1e2a4a 0%, #16213e 100%);
    }
    .doc-cover-side::before {
      content: ''; position: absolute; width: 220px; height: 220px; top: -70px; right: -70px;
      border: 1px solid rgba(255,255,255,.16); border-radius: 50%;
    }
    .doc-cover-side::after {
      content: ''; position: absolute; left: 18px; right: 18px; bottom: 22px; height: 140px;
      background-image: radial-gradient(circle, rgba(255,255,255,.32) 1px, transparent 1.6px);
      background-size: 14px 14px;
    }
    @media (max-width: 640px) {
      .doc-cover-page { grid-template-columns: 1fr; }
      .doc-cover-side { display: none; }
    }

    .doc-meta-table {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px 28px;
      background: var(--doc-bg); border: 1px solid var(--doc-border); border-radius: 10px; padding: 16px 18px; margin-bottom: 22px;
    }
    .doc-meta-row { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; border-bottom: 1px dashed var(--doc-border); padding-bottom: 8px; }
    .doc-meta-row:nth-last-child(-n+2) { border-bottom: none; padding-bottom: 0; }
    .doc-meta-key { color: var(--doc-text-muted); flex-shrink: 0; }
    .doc-meta-val { color: var(--doc-text); font-weight: 600; text-align: right; }

    .doc-sec { margin-bottom: 26px; }
    .doc-sec-heading { font-size: 14.5px; font-weight: 700; color: var(--doc-text); margin-bottom: 10px; display: flex; align-items: baseline; gap: 8px; }
    .doc-sec-heading .num { color: var(--doc-accent); font-weight: 800; font-size: 13px; }
    .doc-text { font-size: 13.5px; color: var(--doc-text-muted); line-height: 1.85; }
    .doc-text + .doc-text { margin-top: 10px; }

    .doc-list { list-style: none; display: flex; flex-direction: column; gap: 9px; }
    .doc-list li { font-size: 13px; color: var(--doc-text-muted); line-height: 1.6; padding-left: 20px; position: relative; }
    .doc-list li::before { content: '·'; position: absolute; left: 4px; color: var(--doc-accent); font-weight: 900; }

    .doc-check-list { list-style: none; display: flex; flex-direction: column; gap: 9px; }
    .doc-check-list li { font-size: 13px; color: var(--doc-text-muted); line-height: 1.6; padding-left: 22px; position: relative; }
    .doc-check-list li::before { content: '✓'; position: absolute; left: 0; top: 0; color: var(--doc-green); font-weight: 700; }

    .doc-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .doc-table th, .doc-table td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--doc-border); }
    .doc-table th { color: var(--doc-text-muted); font-weight: 700; font-size: 11.5px; background: var(--doc-bg); }
    .doc-table td { color: var(--doc-text); }

    .doc-process { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
    .doc-process-step {
      background: var(--doc-bg); border: 1px solid var(--doc-border); border-radius: 999px;
      padding: 7px 15px; font-size: 12.5px; font-weight: 600; color: var(--doc-text);
    }

function Test-AccountLockoutThreshold {
    $policy = (net accounts) | Select-String "Lockout threshold"
    $threshold = [int]($policy -replace '\\D+', '')

    $result = [PSCustomObject]@{
        CheckId   = "ISO-A9-4-3"
        ServerName = $env:COMPUTERNAME
        Item      = "Account Lockout Threshold"
        Expected  = "<= 5"
        Actual    = $threshold
        Compliant = ($threshold -le 5 -and $threshold -gt 0)
        CheckedAt = (Get-Date -Format "yyyy-MM-dd HH:mm:ss")
    }
    return $result
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}

function stackIconFor(name) {
  return stackIcons[name] || stackIcons[String(name).replace(/^Microsoft\s+/, '')] || null;
}

function stackInitial(name) {
  return (String(name).trim()[0] || '?').toUpperCase();
}

  mkDoc(2, '04', [

/* ══ 데이터가 얕은 프로젝트용 6챕터 문서 자동 생성 ══
   기존 tags/desc/detail 필드만 사용하고, 없는 정보는 만들어내지 않습니다.
   풍부한 프로젝트와 동일한 6챕터 체계를 공유 — 내용이 짧을 뿐 구조는 같습니다. */
function buildShallowDocuments(p) {
  const d = p.detail || {};
  const docs = [];

  // 01 문제정의서
  const probSections = [];
  if (d.problem) probSections.push({ type: 'text', content: d.problem });
  else probSections.push({ type: 'text', content: p.desc });
  docs.push(mkDoc(p.id, '01', probSections));

  // 02 요구사항 정의서 — whatIDesigned를 요구사항 형태로 재구성
  if (d.whatIDesigned && d.whatIDesigned.length) {
    docs.push(mkDoc(p.id, '02', [
      { type: 'list', items: d.whatIDesigned },
    ]));
  }

  // 03 설계서 — 아키텍처 다이어그램 + 기술 스택 + 설계 의도
  const designSections = [];
  if (d.diagram) designSections.push({ type: 'architecture', image: d.diagram });
  if (d.techStack && d.techStack.length) designSections.push({ type: 'stack', items: d.techStack });
  if (d.whyDesign && d.whyDesign.length) designSections.push({ type: 'why', items: d.whyDesign });
  if (designSections.length) docs.push(mkDoc(p.id, '03', designSections));

  // 04 구현 결과보고서 — 실제 구현 증적(코드/스크립트)
  if (d.codeBlock) {
    docs.push(mkDoc(p.id, '04', [
      { type: 'code', code: d.codeBlock, caption: d.codeCaption || '' },
    ]));
  }

  // 05 이슈 및 의사결정 보고서 — 구현 중 발생한 이슈(challenge)
  if (d.challenge && d.challenge.length) {
    docs.push(mkDoc(p.id, '05', d.challenge.map(c => ({ type: 'issue', problem: c.issue, resolution: c.resolution }))));
  }

  // 06 완료 보고서 — 결과 및 키워드
  const outcomeSections = [];
  if (d.outcome && d.outcome.length) outcomeSections.push({ type: 'metric', items: d.outcome });
  if (d.keywords && d.keywords.length) outcomeSections.push({ type: 'tags', items: d.keywords });
  if (outcomeSections.length) docs.push(mkDoc(p.id, '06', outcomeSections));

  return docs;
}

function getProjectDocuments(p) {
  return projectDocuments[p.id] || buildShallowDocuments(p);
}

/* ══ 문서 섹션 렌더러 ══ */
function renderSection(sec, secIndex) {
  switch (sec.type) {
    case 'metaTable':
      return `<div class="doc-meta-table">${sec.rows.map(([k, v]) => `
        <div class="doc-meta-row"><span class="doc-meta-key">${escapeHtml(k)}</span><span class="doc-meta-val">${escapeHtml(v)}</span></div>
      `).join('')}</div>`;

    case 'text':
      return `<div class="doc-sec"><p class="doc-text">${escapeHtml(sec.content)}</p></div>`;

    case 'heading':
      return `<div class="doc-sec-heading"><span class="num">${secIndex}.</span>${escapeHtml(sec.text)}</div>`;

    case 'list':
      return `<div class="doc-sec"><ul class="doc-list">${sec.items.map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ul></div>`;

    case 'checklist':
      return `<div class="doc-sec"><ul class="doc-check-list">${sec.items.map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ul></div>`;

    case 'table':
      return `<div class="doc-sec"><table class="doc-table"><thead><tr>${sec.headers.map(h => `<th>${escapeHtml(h)}</th>`).join('')}</tr></thead><tbody>${
        sec.rows.map(r => `<tr>${r.map(c => `<td>${escapeHtml(c)}</td>`).join('')}</tr>`).join('')
      }</tbody></table></div>`;

    case 'flow':
    case 'process':
      return `<div class="doc-sec"><div class="doc-process">${sec.steps.map((s, i) => (i ? `<span class="doc-process-arrow">→</span>` : '') + `<span class="doc-process-step">${escapeHtml(s)}</span>`).join('')}</div></div>`;

    case 'architecture': {
      const img = sec.image;
      if (img) {
        return `<div class="doc-sec"><div class="doc-arch-wrap">
          <img class="doc-arch-img" src="${img}" alt="시스템 아키텍처 다이어그램" loading="lazy"
               onerror="this.closest('.doc-arch-wrap').innerHTML='<div class=&quot;doc-arch-placeholder&quot;>다이어그램 준비 중</div>';"
               onclick="openDiagramLightbox('${img}')">
        </div></div>`;
      }
      return '';
    }

    case 'stack':
      return `<div class="doc-sec"><div class="doc-stack-grid">${sec.items.map(t => {
        const iconSrc = t.icon || stackIconFor(t.name);
        const icon = iconSrc
          ? `<img src="${iconSrc}" alt="" loading="lazy" onerror="this.parentElement.textContent='${escapeHtml(stackInitial(t.name))}';">`
          : escapeHtml(stackInitial(t.name));
        return `<div class="doc-stack-item"><div class="doc-stack-icon" title="${escapeHtml(t.name)}">${icon}</div><span>${escapeHtml(t.name)}</span></div>`;
      }).join('')}</div></div>`;

    case 'why':
      return `<div class="doc-sec">${sec.items.map(w => `
        <div class="doc-decision-card"><div class="doc-decision-title">${escapeHtml(w.title)}</div><p class="doc-text">${escapeHtml(w.desc)}</p></div>
      `).join('')}</div>`;

    case 'issue':
      return `<div class="doc-sec"><div class="doc-issue-card">
        <div class="doc-issue-row"><span class="doc-issue-tag problem">문제</span><span class="doc-issue-text">${escapeHtml(sec.problem)}</span></div>
        ${sec.resolution ? `<div class="doc-issue-row"><span class="doc-issue-tag resolution">해결</span><span class="doc-issue-text">${escapeHtml(sec.resolution)}</span></div>` : ''}
      </div></div>`;

    case 'decisionSimple':
      return `<div class="doc-sec"><div class="doc-decision-card">
        <div class="doc-decision-title">${escapeHtml(sec.title)}</div>
        <p class="doc-text">${escapeHtml(sec.desc)}</p>
      </div></div>`;

    case 'decision':
      return `<div class="doc-sec"><div class="doc-decision-card">
        <div class="doc-decision-id">${escapeHtml(sec.qid)}</div>
        <div class="doc-decision-title">${escapeHtml(sec.question)}</div>
        <div class="doc-decision-row"><span class="doc-decision-label">대안</span><span class="doc-decision-text">${escapeHtml(sec.alternative)}</span></div>
        <div class="doc-decision-row chosen"><span class="doc-decision-label">선택</span><span class="doc-decision-text">${escapeHtml(sec.chosen)} — ${escapeHtml(sec.reason)}</span></div>
      </div></div>`;

    case 'metric':
      return `<div class="doc-sec"><div class="doc-metric-grid">${sec.items.map(o => `
        <div class="doc-metric-card"><div class="doc-metric-value">${escapeHtml(o.value)}</div><div class="doc-metric-label">${escapeHtml(o.label)}</div></div>
      `).join('')}</div></div>`;

    case 'code':
      return `<div class="doc-sec"><pre class="doc-code-block">${escapeHtml(sec.code)}</pre>${sec.caption ? `<div class="doc-code-caption">${escapeHtml(sec.caption)}</div>` : ''}</div>`;

    case 'tags':
      return `<div class="doc-sec"><div class="doc-tag-wrap">${sec.items.map(k => `<span class="doc-tag-chip">${escapeHtml(k)}</span>`).join('')}</div></div>`;

    default:
      return '';
  }
}

let selectedProjectId = null;

function docnbFilteredProjects() {
  return [...projects].sort((a, b) => a.priority - b.priority);
}

function renderDocnbSidebar() {
  const list = docnbFilteredProjects();
  const wrap = document.getElementById('docnbProjectList');

  const byDomain = {};
  list.forEach(p => { (byDomain[p.domain] = byDomain[p.domain] || []).push(p); });
  const domains = DOMAIN_ORDER.filter(d => byDomain[d]).concat(Object.keys(byDomain).filter(d => !DOMAIN_ORDER.includes(d)));

  let seq = 0;
  wrap.innerHTML = domains.map(dom => `
    <div class="docnb-domain-group">
      <div class="docnb-domain-label">${escapeHtml(dom)}</div>
      ${byDomain[dom].map(p => {
        seq++;
        return `
        <div class="docnb-project-item ${p.id === selectedProjectId ? 'active' : ''}" onclick="docnbSelectProject(${p.id})" role="button" tabindex="0">
          <div class="docnb-project-item-top">
            <span class="docnb-project-num">${String(seq).padStart(2, '0')}</span>
            <span class="docnb-project-title">${escapeHtml(p.title)}</span>
          </div>
        </div>
      `;
      }).join('')}
    </div>
  `).join('');
}

function docnbToggleSidebar() {
  document.getElementById('docnbSidebar').classList.toggle('open');
}

            <div class="docnb-doc-card-metabox2">
              <div class="docnb-doc-card-metarow2"><span class="mark">■</span>종료일 : ${escapeHtml(p.date)}</div>
              <div class="docnb-doc-card-metarow2"><span class="mark">■</span>담당 : 이준석</div>
            </div>
            <div class="docnb-doc-card-footer2">${escapeHtml(p.domain.toUpperCase())}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

/* ══ 노트형 문서 모달 — 문서 한 장씩 3D 페이지 플립으로 넘긴다 ══ */
let docModalProjectId = null;
let docModalIndex = 0;

/* 아이콘 (표지 메타 항목용, 라인 스타일) */
const DOC_ICON = {
  doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3h7l5 5v13a1 1 0 01-1 1H7a1 1 0 01-1-1V4a1 1 0 011-1z"/><path d="M14 3v5h5"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
  layers: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
};

function openDocModal(projectId) {
  docModalProjectId = projectId;
  docModalIndex = 0; // 항상 표지(목차·요약)부터 시작
  document.getElementById('docModalOverlay').classList.add('show');
  renderDocModalChrome();
  renderDocModalPage(null);
  document.addEventListener('keydown', docModalKeyHandler);
}

function closeDocModal() {
  document.getElementById('docModalOverlay').classList.remove('show');
  document.getElementById('docModalToc').classList.remove('show');
  document.removeEventListener('keydown', docModalKeyHandler);
}

function docModalKeyHandler(e) {
  if (e.key === 'Escape') closeDocModal();
  else if (e.key === 'ArrowRight') docModalNav(1);
  else if (e.key === 'ArrowLeft') docModalNav(-1);
}

function docModalNav(delta) {
  const p = projects.find(pr => pr.id === docModalProjectId);
  const total = getProjectDocuments(p).length + 1; // +1 = 표지
  const next = docModalIndex + delta;
  if (next < 0 || next >= total) return;
  docModalIndex = next;
  renderDocModalPage(delta > 0 ? 'next' : 'prev');
}

function docModalGoTo(index) {
  if (index === docModalIndex) { document.getElementById('docModalToc').classList.remove('show'); return; }
  const direction = index > docModalIndex ? 'next' : 'prev';
  docModalIndex = index;
  renderDocModalPage(direction);
  document.getElementById('docModalToc').classList.remove('show');
}

function docModalToggleToc(e) {
  e.stopPropagation();
  document.getElementById('docModalToc').classList.toggle('show');
}

/* 헤더/목차/진행바처럼 페이지가 바뀌어도 다시 그릴 필요 없는 "겉표지" 부분
   0번 = 표지(목차·요약), 1..N번 = 실제 관리문서 */
function renderDocModalChrome() {
  const p = projects.find(pr => pr.id === docModalProjectId);
  const docs = getProjectDocuments(p);
  const pageLabels = [{ number: '00', title: '표지 · 목차' }, ...docs];

  document.getElementById('docModalDocNum').textContent = `${p.domain.slice(0, 3).toUpperCase()}-${String(p.id).padStart(3, '0')}`;
  document.getElementById('docModalProjTitle').textContent = p.title;

  document.getElementById('docModalProgress').innerHTML = pageLabels.map((d, i) => `
    <span class="doc-modal-progress-seg" onclick="docModalGoTo(${i})" title="${escapeHtml(d.number + ' ' + d.title)}"></span>
  `).join('');

  document.getElementById('docModalToc').innerHTML = pageLabels.map((d, i) => `
    <div class="doc-modal-toc-item" onclick="docModalGoTo(${i})">
      <span class="doc-modal-toc-num">${d.number}</span><span>${escapeHtml(d.title)}</span>
    </div>
  `).join('');
}

/* 실제로 페이지 한 장을 그리고, direction이 있으면 3D 플립 애니메이션을 건다 */
function renderDocModalPage(direction) {
  const p = projects.find(pr => pr.id === docModalProjectId);
  const docs = getProjectDocuments(p);
  const total = docs.length + 1;
  const inner = document.getElementById('docModalBodyInner');

  const currentLabel = docModalIndex === 0 ? '00' : docs[docModalIndex - 1].number;
  const lastLabel = docs.length ? docs[docs.length - 1].number : '00';
  document.getElementById('docModalPageInd').textContent = `${currentLabel} / ${lastLabel}`;

  document.querySelectorAll('#docModalProgress .doc-modal-progress-seg').forEach((seg, i) => {
    seg.classList.toggle('done', i < docModalIndex);
    seg.classList.toggle('current', i === docModalIndex);
  });
  document.querySelectorAll('#docModalToc .doc-modal-toc-item').forEach((item, i) => {
    item.classList.toggle('current', i === docModalIndex);
    const dot = item.querySelector('.doc-modal-toc-dot');
    if (i === docModalIndex && !dot) item.insertAdjacentHTML('beforeend', '<span class="doc-modal-toc-dot"></span>');
    if (i !== docModalIndex && dot) dot.remove();
  });

  if (docModalIndex === 0) {
    inner.innerHTML = renderCoverPage(p, docs);
  } else {
    const doc = docs[docModalIndex - 1];
    let headingCounter = 0;
    inner.innerHTML = `
      <div class="doc-page-eyebrow">${doc.number}. ${escapeHtml(doc.title)}</div>
      <div class="doc-page-title">${escapeHtml(doc.title)}</div>
      <div class="doc-page-subtitle">${escapeHtml(doc.subtitle)}</div>
      ${doc.sections.map(sec => {
        if (sec.type === 'heading') headingCounter++;
        return renderSection(sec, headingCounter);
      }).join('')}
    `;
  }

  inner.classList.remove('doc-page-flip-next', 'doc-page-flip-prev');
  if (direction) {
    void inner.offsetWidth; // 애니메이션 재시작을 위한 리플로우
    inner.classList.add(direction === 'next' ? 'doc-page-flip-next' : 'doc-page-flip-prev');
  }
  document.getElementById('docModalBody').scrollTop = 0;

  const prevBtn = document.getElementById('docNavPrev');
  const nextBtn = document.getElementById('docNavNext');
  prevBtn.disabled = docModalIndex === 0;
  nextBtn.disabled = docModalIndex === total - 1;
  document.getElementById('docNavCenter').textContent = `${docModalIndex + 1} / ${total}`;
}

/* ══ 표지 페이지 — 모든 프로젝트가 동일한 템플릿을 공유하고
   제목/날짜/목차/요약만 프로젝트별로 바뀐다 ══ */
function renderCoverPage(p, docs) {
  return `
    <div class="doc-cover-page">
      <div class="doc-cover-main">
        <div class="doc-cover-badge">
          <div class="lbl">DOCUMENT</div>
          <div class="num">${String(p.id).padStart(3, '0')}</div>
          <div class="rule"></div>
        </div>
        <div class="doc-cover-eyebrow">PROJECT DELIVERABLE</div>
        <div class="doc-cover-title">${escapeHtml(p.title)}</div>
        <div class="doc-cover-divider"></div>
        <div class="doc-cover-subtitle">구분 : ${escapeHtml(p.domain)} 관리문서</div>

        <div class="doc-cover-meta-list">
          <div class="doc-cover-meta-row"><span class="dcm-icon">${DOC_ICON.doc}</span><span class="dcm-label">문서 구분</span><span class="dcm-sep">|</span><span class="dcm-value">${escapeHtml(p.domain)} 관리문서</span></div>
          <div class="doc-cover-meta-row"><span class="dcm-icon">${DOC_ICON.cal}</span><span class="dcm-label">작성일</span><span class="dcm-sep">|</span><span class="dcm-value">${escapeHtml(p.date)}</span></div>
          <div class="doc-cover-meta-row"><span class="dcm-icon">${DOC_ICON.layers}</span><span class="dcm-label">문서 수</span><span class="dcm-sep">|</span><span class="dcm-value">${docs.length}건</span></div>
          <div class="doc-cover-meta-row"><span class="dcm-icon">${DOC_ICON.user}</span><span class="dcm-label">작성자</span><span class="dcm-sep">|</span><span class="dcm-value">이준석</span></div>
        </div>

        <div class="doc-cover-section-title">목차</div>
        <ol class="doc-cover-toc">
          ${docs.map((d, i) => `
            <li class="doc-cover-toc-item" onclick="docModalGoTo(${i + 1})"><span class="n">${d.number}</span><span>${escapeHtml(d.title)}</span></li>
          `).join('')}
        </ol>

        <div class="doc-cover-section-title">요약</div>
        <p class="doc-cover-summary">${escapeHtml(p.desc)}</p>
      </div>
      <div class="doc-cover-side" aria-hidden="true"></div>
    </div>
  `;
}

/* ══ Architecture 이미지 라이트박스 ══ */

  document.getElementById('lightboxImg').src = src;
  document.getElementById('diagramLightbox').classList.add('show');
}

renderDocnbSidebar();
renderProjectGallery();

// 라이트/다크 모드 토글 로직
(function() {
  const html = document.documentElement;
  const theme = localStorage.getItem('theme') || 'dark';
  const toggle = document.getElementById('theme-toggle');
  const sunIcon = toggle?.querySelector('.sun-icon');
  const moonIcon = toggle?.querySelector('.moon-icon');
  
  function setTheme(t) {
    if (t === 'light') {
      html.classList.add('light-mode');
      html.style.background = '#f8fafc';
      localStorage.setItem('theme', 'light');
      if (sunIcon && moonIcon) {
        sunIcon.style.display = 'block';
        moonIcon.style.display = 'none';
      }
    } else {
      html.classList.remove('light-mode');
      html.style.background = '#0f172a';
      localStorage.setItem('theme', 'dark');
      if (sunIcon && moonIcon) {
        sunIcon.style.display = 'none';
        moonIcon.style.display = 'block';
      }
    }
  }
  
  setTheme(theme);
  toggle?.addEventListener('click', () => {
    const current = localStorage.getItem('theme') || 'dark';
    setTheme(current === 'dark' ? 'light' : 'dark');
  });
  
  // 현재 페이지 네비게이션 활성화
  const path = window.location.pathname.split('/').pop() || 'index.html';
  document.querySelectorAll('.topbar-nav .tnav').forEach(link => {
    const href = link.getAttribute('href');
    if (href === path || (path === '' && href === 'index.html')) {
      link.classList.add('active');
    } else {
      link.classList.remove('active');
    }
  });
})();
</script>
