<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes | 이준석</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<style>
  :root{
    --ink:#0f172a;
    --ink-soft:#475569;
    --ink-faint:#94a3b8;
    --line:#e2e8f0;
    --navy:#173c78;
    --blue:#2563eb;
    --blue-soft:#eff4fd;
    --font-main:"Pretendard","Gowun Dodum","Malgun Gothic",sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:#ffffff;
    color:var(--ink);
    font-family:var(--font-main);
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px 32px;
    border-bottom:1px solid var(--line);
    position:relative;
  }
  .topbar-brand{
    font-weight:700;
    text-decoration:none;
    color:var(--ink);
    font-size:.95rem;
    position:absolute;
    left:32px;
  }
  .topbar-links{ display:flex; gap:18px; }
  .topbar-links a{
    color:var(--ink-soft);
    text-decoration:none;
    font-size:.88rem;
  }
  .topbar-links a:hover{ color:var(--navy); }

  main{
    max-width:1280px;
    margin:0 auto;
    padding:48px 24px 96px;
  }

  .page-eyebrow{
    font-size:.82rem;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 12px;
  }

  .page-title{
    font-size:2.1rem;
    font-weight:700;
    letter-spacing:-.02em;
    margin:0 0 16px;
  }

  .page-lead{
    font-size:1rem;
    line-height:1.7;
    color:var(--ink-soft);
    margin:0 0 14px;
    max-width:860px;
  }

  .page-note{
    font-size:.8rem;
    line-height:1.65;
    color:var(--ink-faint);
    margin:0 0 32px;
    padding:12px 16px;
    border:1px solid var(--line);
    border-radius:10px;
    background:#f8fafc;
    max-width:860px;
  }

  /* ── 검색 + 상태 바 ── */
  .notes-toolbar{
    display:flex;
    align-items:center;
    gap:12px;
    margin:0 0 24px;
    flex-wrap:wrap;
  }

  .notes-search{
    flex:1;
    min-width:220px;
    max-width:360px;
    position:relative;
  }

  .notes-search input{
    width:100%;
    padding:11px 14px 11px 38px;
    border:1.4px solid var(--line);
    border-radius:10px;
    font:inherit;
    font-size:.88rem;
    color:var(--ink);
    background:#f8fafc;
    transition:border-color .15s ease, background-color .15s ease;
  }
  .notes-search input:focus{
    outline:none;
    border-color:var(--navy);
    background:#ffffff;
  }
  .notes-search-icon{
    position:absolute;
    left:13px;
    top:50%;
    transform:translateY(-50%);
    color:var(--ink-faint);
    font-size:.85rem;
    pointer-events:none;
  }

  .notes-count{
    font-size:.82rem;
    color:var(--ink-faint);
    white-space:nowrap;
  }
  .notes-count b{ color:var(--navy); font-weight:700; }

  .notes-source{
    margin-left:auto;
    font-size:.78rem;
    color:var(--ink-faint);
    text-decoration:none;
    display:flex;
    align-items:center;
    gap:6px;
    padding:7px 12px;
    border:1px solid var(--line);
    border-radius:999px;
    transition:border-color .15s ease, color .15s ease;
  }
  .notes-source:hover{ border-color:var(--navy); color:var(--navy); }

  /* ── 상태 영역 (로딩/에러/빈 결과) ── */
  .notes-state{
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:10px;
    padding:64px 24px;
    color:var(--ink-faint);
    font-size:.9rem;
    text-align:center;
  }
  .notes-state.show{ display:flex; }
  .notes-spinner{
    width:22px; height:22px;
    border:2.5px solid var(--line);
    border-top-color:var(--navy);
    border-radius:50%;
    animation:notes-spin .8s linear infinite;
  }
  @keyframes notes-spin{ to{ transform:rotate(360deg); } }

  /* ── 메모 보드 ── */
  .notes-board{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:18px;
  }

  .note-card{
    position:relative;
    border-radius:14px;
    padding:18px 18px 16px;
    cursor:pointer;
    border:1px solid rgba(15,23,42,.06);
    box-shadow:0 2px 10px rgba(15,23,42,.06);
    transition:transform .18s ease, box-shadow .18s ease;
    transform:rotate(var(--r, 0deg));
    display:flex;
    flex-direction:column;
  }
  .note-card:hover,
  .note-card:focus-visible{
    transform:rotate(0deg) translateY(-3px);
    box-shadow:0 14px 26px rgba(15,23,42,.14);
  }

  .note-card.c0{ background:#fff7e0; }
  .note-card.c1{ background:#eef4ff; }
  .note-card.c2{ background:#eafaf0; }
  .note-card.c3{ background:#ffeef0; }
  .note-card.c4{ background:#f3eeff; }

  .note-title{
    font-size:.98rem;
    font-weight:700;
    color:var(--ink);
    margin:0 0 10px;
    line-height:1.4;
    word-break:keep-all;
  }

  .note-body{
    font-size:.82rem;
    line-height:1.6;
    color:var(--ink-soft);
    white-space:pre-wrap;
    word-break:keep-all;
    max-height:4.8em;
    overflow:hidden;
    position:relative;
    transition:max-height .25s ease;
  }
  .note-card.open .note-body{
    max-height:600px;
  }
  .note-body::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:0;
    height:22px;
    background:linear-gradient(0deg, var(--fade-color, #fff7e0) 10%, transparent 100%);
    opacity:1;
    transition:opacity .2s ease;
  }
  .note-card.open .note-body::after{ opacity:0; }

  .note-body .tag-label{
    display:inline-block;
    font-size:.68rem;
    font-weight:700;
    color:var(--navy);
    background:rgba(23,60,120,.1);
    padding:1px 7px;
    border-radius:999px;
    margin:8px 0 4px;
  }

  .note-toggle{
    font-size:.72rem;
    font-weight:600;
    color:var(--ink-faint);
    margin-top:10px;
    align-self:flex-start;
  }

  .note-meta{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:12px;
    padding-top:10px;
    border-top:1px solid rgba(15,23,42,.08);
    font-size:.72rem;
    color:var(--ink-faint);
    flex-wrap:wrap;
  }
  .note-meta .note-labels{ display:flex; gap:5px; flex-wrap:wrap; }
  .note-meta .note-label-chip{
    font-weight:600;
    color:var(--navy);
    background:rgba(255,255,255,.65);
    padding:1px 7px;
    border-radius:999px;
  }

  @media (max-width:640px){
    .notes-toolbar{ flex-direction:column; align-items:stretch; }
    .notes-search{ max-width:none; }
    .notes-source{ margin-left:0; align-self:flex-start; }
    .notes-board{ grid-template-columns:1fr; }
    .note-card{ transform:none !important; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <a class="topbar-brand" href="../index.html" title="홈으로 돌아가기">이준석</a>
    <div class="topbar-links">
      <a href="./lab.html">Lab</a>
      <a href="../index.html">Home</a>
    </div>
  </div>

  <main>
    <p class="page-eyebrow">Lab · Notes</p>
    <h1 class="page-title">지식 메모 아카이브</h1>
    <p class="page-lead">공부하다 막히면 GitHub Issue로 한 줄씩 남긴 메모입니다. 질문과 답, 그리고 제 말로 다시 정리한 한 줄을 모아둡니다.</p>
    <p class="page-note">메모는 <a href="https://github.com/jjunstone/SSD" target="_blank" rel="noopener" style="color:var(--navy);">GitHub Issue</a>에 올리면 자동으로 이 목록에 반영됩니다. 정리 중인 메모라 내용이 거칠거나 비어 있을 수 있습니다.</p>

    <div class="notes-toolbar">
      <div class="notes-search">
        <span class="notes-search-icon">⌕</span>
        <input id="notesSearch" type="text" placeholder="메모 검색" aria-label="메모 검색" disabled>
      </div>
      <span class="notes-count" id="notesCount"></span>
      <a class="notes-source" href="https://github.com/jjunstone/SSD/issues" target="_blank" rel="noopener">⎘ GitHub에서 메모 남기기</a>
    </div>

    <div class="notes-state show" id="notesLoading">
      <span class="notes-spinner" aria-hidden="true"></span>
      <span>메모를 불러오는 중…</span>
    </div>
    <div class="notes-state" id="notesError">
      <span>메모를 불러오지 못했습니다. 잠시 후 다시 시도해주세요.</span>
    </div>
    <div class="notes-state" id="notesEmpty">
      <span>검색 결과가 없습니다.</span>
    </div>

    <div class="notes-board" id="notesBoard"></div>
  </main>

  <footer style="max-width:1280px;margin:0 auto;padding:0 24px 64px;display:flex;justify-content:center;gap:16px;font-size:.86rem;">
    <a href="mailto:happyday7190@gmail.com" style="color:var(--ink-soft);text-decoration:none;">Email</a>
    <a href="../etc/files/resume.html" target="_blank" rel="noopener" style="color:var(--ink-soft);text-decoration:none;">Resume 다운로드</a>
  </footer>

  <script>
  (function(){
    var REPO = "jjunstone/SSD";
    var board = document.getElementById("notesBoard");
    var loadingEl = document.getElementById("notesLoading");
    var errorEl = document.getElementById("notesError");
    var emptyEl = document.getElementById("notesEmpty");
    var countEl = document.getElementById("notesCount");
    var searchInput = document.getElementById("notesSearch");
    var COLORS = ["c0","c1","c2","c3","c4"];
    var FADE = { c0:"#fff7e0", c1:"#eef4ff", c2:"#eafaf0", c3:"#ffeef0", c4:"#f3eeff" };
    var allNotes = [];

    function esc(s){
      return String(s == null ? "" : s)
        .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    function formatDate(iso){
      var d = new Date(iso);
      var now = new Date();
      var diffDays = Math.floor((now - d) / 86400000);
      if (diffDays <= 0) return "오늘";
      if (diffDays === 1) return "1일 전";
      if (diffDays < 30) return diffDays + "일 전";
      return d.getFullYear() + "." + String(d.getMonth()+1).padStart(2,"0") + "." + String(d.getDate()).padStart(2,"0");
    }

    function formatBody(body){
      var html = esc(body || "(내용 없음)");
      html = html.replace(/^## (.*)$/gm, '<span class="tag-label">$1</span><br>');
      return html;
    }

    function render(){
      var q = searchInput.value.trim().toLowerCase();
      var list = allNotes.filter(function(n){
        return !q || (n.title + " " + n.body).toLowerCase().indexOf(q) !== -1;
      });

      if (list.length === 0) {
        board.innerHTML = "";
        emptyEl.classList.add("show");
        countEl.textContent = "";
        return;
      }
      emptyEl.classList.remove("show");
      countEl.innerHTML = "총 <b>" + allNotes.length + "</b>개 메모" + (q ? " · " + list.length + "개 검색됨" : "");

      board.innerHTML = list.map(function(n){
        var color = COLORS[n.number % COLORS.length];
        var rot = ((n.number % 5) - 2) * 1.1;
        var title = esc(n.title.replace(/^질문:\s*/, ""));
        var labelsHtml = (n.labels || []).map(function(l){
          return '<span class="note-label-chip">#' + esc(l.name) + "</span>";
        }).join("");
        return '<article class="note-card ' + color + '" style="--r:' + rot + 'deg; --fade-color:' + FADE[color] + ';" tabindex="0" role="button" aria-expanded="false">' +
          '<h3 class="note-title">' + title + "</h3>" +
          '<div class="note-body">' + formatBody(n.body) + "</div>" +
          '<span class="note-toggle">더 보기</span>' +
          '<div class="note-meta"><span>' + formatDate(n.createdAt) + '</span><span class="note-labels">' + labelsHtml + "</span></div>" +
        "</article>";
      }).join("");
    }

    board.addEventListener("click", function(e){
      var card = e.target.closest(".note-card");
      if (!card) return;
      toggleCard(card);
    });
    board.addEventListener("keydown", function(e){
      if (e.key !== "Enter" && e.key !== " ") return;
      var card = e.target.closest(".note-card");
      if (!card) return;
      e.preventDefault();
      toggleCard(card);
    });
    function toggleCard(card){
      var isOpen = card.classList.toggle("open");
      card.setAttribute("aria-expanded", isOpen ? "true" : "false");
      var toggleLabel = card.querySelector(".note-toggle");
      if (toggleLabel) toggleLabel.textContent = isOpen ? "접기" : "더 보기";
    }

    searchInput.addEventListener("input", render);

    fetch("https://api.github.com/repos/" + REPO + "/issues?state=all&per_page=100", {
      headers: { "Accept": "application/vnd.github+json" }
    })
      .then(function(res){
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function(data){
        allNotes = (Array.isArray(data) ? data : [])
          .filter(function(n){ return !n.pull_request; })
          .map(function(n){
            return {
              number: n.number,
              title: n.title || "",
              body: n.body || "",
              labels: (n.labels || []).map(function(l){ return { name: l.name }; }),
              createdAt: n.created_at
            };
          })
          .sort(function(a,b){ return b.createdAt.localeCompare(a.createdAt); });
        loadingEl.classList.remove("show");
        searchInput.disabled = false;
        render();
      })
      .catch(function(){
        loadingEl.classList.remove("show");
        errorEl.classList.add("show");
      });
  })();
  </script>
</body>
</html>
