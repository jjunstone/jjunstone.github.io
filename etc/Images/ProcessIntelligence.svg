<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="Pretendard, -apple-system, 'Malgun Gothic', sans-serif">
  <rect width="960" height="620" fill="#f8fafc"/>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#141414">업무 프로세스 이해관계자 정렬 플랫폼 — 5계층 아키텍처</text>

  <!-- Layer 1: Auth -->
  <g>
    <rect x="40" y="70" width="880" height="70" rx="10" fill="#eef1f7" stroke="#173c78" stroke-width="1.5"/>
    <text x="64" y="98" font-size="14" font-weight="700" fill="#173c78">① 인증·보안</text>
    <text x="64" y="120" font-size="13" fill="#5b5b5b">Entra ID · Dataverse 보안 역할 — 소속 부문별 프로젝트 데이터 조회·입력 범위 제한</text>
  </g>

  <!-- Arrow -->
  <polygon points="470,145 490,145 480,160" fill="#8a8a8a"/>

  <!-- Layer 2: Data -->
  <g>
    <rect x="40" y="165" width="880" height="70" rx="10" fill="#ffffff" stroke="#c9ccd1" stroke-width="1.5"/>
    <text x="64" y="193" font-size="14" font-weight="700" fill="#141414">② 데이터</text>
    <text x="64" y="215" font-size="13" fill="#5b5b5b">Dataverse 10개 테이블 — 모든 화면·Flow·Copilot이 공유하는 단일 저장소, 테이블 단위 감사 활성화</text>
  </g>

  <polygon points="470,240 490,240 480,255" fill="#8a8a8a"/>

  <!-- Layer 3: Application -->
  <g>
    <rect x="40" y="260" width="880" height="80" rx="10" fill="#ffffff" stroke="#c9ccd1" stroke-width="1.5"/>
    <text x="64" y="288" font-size="14" font-weight="700" fill="#141414">③ 애플리케이션</text>
    <text x="64" y="310" font-size="13" fill="#5b5b5b">Model-driven App 1개 + Custom Page 4개</text>
    <text x="64" y="328" font-size="12.5" fill="#8a8a8a">Process Map · Discussion Map · Issue Board · Activity Timeline</text>
  </g>

  <polygon points="470,345 490,345 480,360" fill="#8a8a8a"/>

  <!-- Layer 4: Intelligence -->
  <g>
    <rect x="40" y="365" width="880" height="80" rx="10" fill="#eef1f7" stroke="#173c78" stroke-width="1.5"/>
    <text x="64" y="393" font-size="14" font-weight="700" fill="#173c78">④ 지능화</text>
    <text x="64" y="415" font-size="13" fill="#5b5b5b">Copilot Studio 단일 에이전트 (6개 기능)</text>
    <text x="64" y="433" font-size="12.5" fill="#8a8a8a">의견·업무 단계 분석 → 관계·쟁점 후보·변경안 제안 (공식 데이터 직접 변경 불가)</text>
  </g>

  <polygon points="470,450 490,450 480,465" fill="#8a8a8a"/>

  <!-- Layer 5: Automation/Governance -->
  <g>
    <rect x="40" y="470" width="880" height="80" rx="10" fill="#ffffff" stroke="#c9ccd1" stroke-width="1.5"/>
    <text x="64" y="498" font-size="14" font-weight="700" fill="#141414">⑤ 자동화·거버넌스</text>
    <text x="64" y="520" font-size="13" fill="#5b5b5b">Power Automate Flow 5개 · Purview Audit/DLP</text>
    <text x="64" y="538" font-size="12.5" fill="#8a8a8a">승인 · 알림 · SLA 추적 · 민감정보 감지 · 활동 기록 · 관리 활동 감사</text>
  </g>

  <text x="480" y="590" text-anchor="middle" font-size="12" fill="#8a8a8a">AI 판단(④)과 공식 데이터 변경(⑤)이 분리된 구조 — Copilot은 제안만, 승인·반영은 Flow가 수행</text>
</svg>
