<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이준석 | Infrastructure &amp; Security Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "xpfijrd574");
</script>
<style>
  :root{
    --ink:#141414;
    --ink-soft:#5b5b5b;
    --line:#e6e6e6;
    --accent:#173c78;
    --font-main:"Pretendard","Gowun Dodum","Malgun Gothic",sans-serif;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background:#ffffff;
    color:var(--ink);
    font-family:var(--font-main);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .home{
    width:100%;
    max-width:640px;
    text-align:center;
  }

  .eyebrow{
    font-size:.82rem;
    font-weight:600;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 18px;
    opacity:0;
  }

  .name{
    font-size:2.6rem;
    font-weight:700;
    letter-spacing:-.02em;
    margin:0 0 16px;
    opacity:0;
  }

  .desc{
    font-size:1.05rem;
    line-height:1.7;
    color:var(--ink-soft);
    margin:0 0 44px;
    opacity:0;
  }

  .actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }

  .action{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:32px 20px;
    border:1.4px solid var(--line);
    border-radius:14px;
    text-decoration:none;
    color:var(--ink);
    opacity:0;
  }

  .action-title{
    font-size:1.12rem;
    font-weight:700;
    letter-spacing:-.01em;
  }

  .action-sub{
    font-size:.86rem;
    color:var(--ink-soft);
  }

  .action:hover{
    border-color:var(--accent);
  }

  .action:hover .action-title{
    color:var(--accent);
  }

  /* Motion 로드 전/비활성 환경(스크립트 차단, prefers-reduced-motion)에서도
     콘텐츠가 보이도록 하는 안전장치 — JS가 opacity를 올리지 못하면 CSS가 대신 보여준다 */
  .no-js .eyebrow,
  .no-js .name,
  .no-js .desc,
  .no-js .action,
  html:not(.motion-ready) .eyebrow,
  html:not(.motion-ready) .name,
  html:not(.motion-ready) .desc,
  html:not(.motion-ready) .action{
    opacity:1;
  }

  @media (prefers-reduced-motion: reduce){
    .eyebrow, .name, .desc, .action{ opacity:1 !important; transform:none !important; }
  }

  @media (max-width:520px){
    .actions{ grid-template-columns:1fr; }
    .name{ font-size:2.1rem; }
  }
</style>
</head>
<body>
  <div class="home">
    <p class="eyebrow">Infrastructure &amp; Security Engineer</p>
    <h1 class="name">이준석</h1>
    <p class="desc">인프라와 보안을 운영하며 자동화와 Cloud Platform, DevOps로 역량을 넓히고 있습니다.</p>

    <div class="actions">
      <a class="action" href="./career.html">
        <span class="action-title">경력과 경험</span>
        <span class="action-sub">어떻게 살아왔는가</span>
      </a>
      <a class="action" href="./azure-knowledge-platform/projects.html">
        <span class="action-title">프로젝트</span>
        <span class="action-sub">어떤 걸 할 줄 아는가</span>
      </a>
    </div>
  </div>

  <script type="module">
    // Motion(바닐라, framer-motion의 non-React 버전)을 CDN에서 불러와
    // 진입 애니메이션과 버튼 호버의 스프링감을 구현한다.
    // 스크립트 로드가 실패해도(오프라인, 광고차단 등) 위 CSS 안전장치가
    // 콘텐츠를 그대로 보여주므로 접근성이 깨지지 않는다.
    try {
      const { animate, stagger } = await import('https://cdn.jsdelivr.net/npm/motion@11/+esm');
      document.documentElement.classList.add('motion-ready');

      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (!reduced) {
        animate(
          '.eyebrow, .name, .desc',
          { opacity: [0, 1], y: [10, 0] },
          { duration: 0.5, delay: stagger(0.08), easing: [0.22, 1, 0.36, 1] }
        );
        animate(
          '.action',
          { opacity: [0, 1], y: [14, 0] },
          { duration: 0.5, delay: stagger(0.08, { startDelay: 0.2 }), easing: [0.22, 1, 0.36, 1] }
        );

        document.querySelectorAll('.action').forEach((el) => {
          el.addEventListener('mouseenter', () => {
            animate(el, { y: -4, scale: 1.015 }, { type: 'spring', stiffness: 320, damping: 20 });
          });
          el.addEventListener('mouseleave', () => {
            animate(el, { y: 0, scale: 1 }, { type: 'spring', stiffness: 320, damping: 22 });
          });
        });
      } else {
        animate('.eyebrow, .name, .desc, .action', { opacity: 1 }, { duration: 0 });
      }
    } catch (e) {
      // Motion 로드 실패 시 콘텐츠는 이미 CSS 안전장치로 보이는 상태이므로 조용히 넘어간다.
      document.documentElement.classList.add('motion-ready');
    }
  </script>
</body>
</html>
