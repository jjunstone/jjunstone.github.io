<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이준석 | Infrastructure &amp; Security Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "xpfijrd574");
</script>
<style>
  :root{
    --ink:#141414;
    --ink-soft:#5b5b5b;
    --line:#e6e6e6;
    --accent:#173c78;
    --font-main:"Pretendard","Gowun Dodum","Malgun Gothic",sans-serif;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background:#ffffff;
    color:var(--ink);
    font-family:var(--font-main);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .home{
    width:100%;
    max-width:640px;
    text-align:center;
  }

  .eyebrow{
    font-size:.82rem;
    font-weight:600;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 18px;
  }

  .name{
    font-size:2.6rem;
    font-weight:700;
    letter-spacing:-.02em;
    margin:0 0 16px;
  }

  .desc{
    font-size:1.05rem;
    line-height:1.7;
    color:var(--ink-soft);
    margin:0 0 44px;
  }

  .actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }

  .action{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:32px 20px;
    border:1.4px solid var(--line);
    border-radius:14px;
    text-decoration:none;
    color:var(--ink);
    transition:border-color .18s ease, transform .18s ease, box-shadow .18s ease;
  }

  .action-title{
    font-size:1.12rem;
    font-weight:700;
    letter-spacing:-.01em;
  }

  .action-sub{
    font-size:.86rem;
    color:var(--ink-soft);
  }

  .action:hover{
    border-color:var(--accent);
    transform:translateY(-2px);
    box-shadow:0 10px 24px rgba(23,60,120,.1);
  }

  .action:hover .action-title{
    color:var(--accent);
  }

  @media (max-width:520px){
    .actions{ grid-template-columns:1fr; }
    .name{ font-size:2.1rem; }
  }
</style>
</head>
<body>
  <div class="home">
    <p class="eyebrow">Infrastructure &amp; Security Engineer</p>
    <h1 class="name">이준석</h1>
    <p class="desc">인프라와 보안을 운영하며 자동화와 Cloud Platform, DevOps로 역량을 넓히고 있습니다.</p>

    <div class="actions">
      <a class="action" href="./career.html">
        <span class="action-title">경력과 경험</span>
        <span class="action-sub">어떻게 살아왔는가</span>
      </a>
      <a class="action" href="./azure-knowledge-platform/projects.html">
        <span class="action-title">프로젝트</span>
        <span class="action-sub">어떤 걸 할 줄 아는가</span>
      </a>
    </div>
  </div>
</body>
</html>
